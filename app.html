<style>
:root {
  --green: #07C160;
  --green-dark: #059B4D;
  --bg: #F4F5F7;
  --card: #FFFFFF;
  --text: #14171A;
  --sub: #8A8F99;
  --line: #EFF0F2;
  --red: #FA5151;
  --red-bg: #FFF2F1;
  --orange: #FF9F43;
  --blue: #576B95;
  --purple: #8B6CFF;
  --shadow: 0 2px 14px rgba(20, 23, 26, 0.05);
  --radius: 16px;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: radial-gradient(1200px 800px at 50% -10%, #1D2A24 0%, #0D0F12 55%, #08090B 100%);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

.stage {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100vh;
  padding: 24px;
}

.device {
  position: relative;
  width: 390px;
  height: min(844px, calc(100vh - 48px));
  background: #000;
  border-radius: 52px;
  padding: 9px;
  box-shadow: 0 40px 90px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 0 0 1px rgba(255,255,255,.14);
}

.screen {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.island {
  position: absolute;
  top: 11px;
  left: 50%;
  transform: translateX(-50%);
  width: 108px;
  height: 29px;
  background: #000;
  border-radius: 18px;
  z-index: 50;
  pointer-events: none;
}

.statusbar {
  height: 46px;
  flex: 0 0 46px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  padding: 0 24px 6px;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .2px;
  color: #14171A;
  background: var(--bg);
  position: relative;
  z-index: 20;
}

.sb-right { display: flex; align-items: center; gap: 5px; }
.sb-right svg { display: block; }

#view {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: relative;
}
#view::-webkit-scrollbar { display: none; }

.page { padding: 4px 16px 20px; animation: pageIn .26s ease both; }

@keyframes pageIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ---------- 通用头部 ---------- */
.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 16px 12px;
  margin: 0 -16px;
  position: sticky;
  top: 0;
  z-index: 12;
  background: var(--bg);
  box-shadow: 0 8px 10px -10px rgba(20, 30, 40, .16);
}

.page-head h1 { font-size: 21px; font-weight: 700; letter-spacing: -.3px; }
.page-head .sub { font-size: 12px; color: var(--sub); margin-top: 3px; }

.icon-btn {
  width: 34px; height: 34px;
  border: none;
  background: transparent;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  cursor: pointer;
  flex: 0 0 auto;
}
.icon-btn:active { background: rgba(0,0,0,.06); }
.icon-btn.round { background: #fff; box-shadow: var(--shadow); }

.head-title {
  flex: 1;
  font-size: 16px;
  font-weight: 600;
  text-align: center;
}

/* ---------- 卡片 ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 20px 2px 10px;
}
.section-title h2 { font-size: 15px; font-weight: 650; letter-spacing: -.2px; }
.section-title span { font-size: 12px; color: var(--sub); }

/* ---------- 首页 ---------- */
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 22px;
  padding: 18px 18px 16px;
  color: #fff;
  background: linear-gradient(135deg, #0BC26A 0%, #059B4D 62%, #048346 100%);
  box-shadow: 0 10px 24px rgba(7, 193, 96, 0.24);
}
.hero::before {
  content: "";
  position: absolute;
  right: -46px; top: -60px;
  width: 190px; height: 190px;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
}
.hero::after {
  content: "";
  position: absolute;
  right: 24px; bottom: -44px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
}
.hero-top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
.hero-greet { font-size: 13px; opacity: .86; }
.hero-title { font-size: 23px; font-weight: 700; margin-top: 5px; letter-spacing: -.4px; }
.hero-avatar {
  width: 44px; height: 44px;
  border-radius: 14px;
  background: rgba(255,255,255,.22);
  border: 1px solid rgba(255,255,255,.35);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700;
  backdrop-filter: blur(4px);
}
.hero-stats {
  position: relative; z-index: 1;
  display: flex; gap: 18px;
  margin-top: 16px;
}
.hero-stat b { font-size: 22px; font-weight: 700; }
.hero-stat span { font-size: 11px; opacity: .82; display: block; margin-top: 1px; }
.hero-cta {
  position: relative; z-index: 1;
  margin-top: 14px;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px;
  border-radius: 12px;
  background: #fff;
  color: var(--green-dark);
  font-size: 14px;
  font-weight: 650;
  cursor: pointer;
  border: none;
  width: 100%;
}
.hero-cta:active { transform: scale(.99); }

.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.quick {
  background: #fff;
  border-radius: 14px;
  padding: 12px 4px 10px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  border: 1px solid rgba(20,23,26,.02);
}
.quick .q-icon {
  width: 34px; height: 34px;
  border-radius: 11px;
  margin: 0 auto 7px;
  display: flex; align-items: center; justify-content: center;
}
.quick span { font-size: 11.5px; color: #3B4148; }

.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.stat {
  background: #fff; border-radius: 14px; padding: 11px 10px;
  box-shadow: var(--shadow);
}
.stat b { font-size: 18px; font-weight: 700; display: block; }
.stat span { font-size: 11px; color: var(--sub); }
.stat em { font-style: normal; font-size: 10px; color: var(--green); margin-left: 3px; }

/* 今日排期 */
.slot-mini { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.slot-mini:last-child { border-bottom: none; }
.slot-time { font-size: 12px; font-weight: 650; width: 76px; color: #333; font-variant-numeric: tabular-nums; }
.slot-dot { width: 7px; height: 7px; border-radius: 50%; background: #D8DCE1; flex: 0 0 auto; }
.slot-dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(7,193,96,.14); }
.slot-dot.warn { background: var(--orange); }
.slot-info { flex: 1; min-width: 0; }
.slot-info b { font-size: 13px; font-weight: 550; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-info span { font-size: 11px; color: var(--sub); }
.slot-status { font-size: 11px; color: var(--sub); flex: 0 0 auto; }
.slot-status.done { color: var(--green); }

/* 比例条 */
.ratio-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.ratio-item { display: flex; align-items: center; gap: 10px; }
.ratio-label { width: 62px; font-size: 12px; color: #444; }
.ratio-bar { flex: 1; height: 7px; border-radius: 4px; background: #F1F2F4; overflow: hidden; }
.ratio-bar i { display: block; height: 100%; border-radius: 4px; }
.ratio-num { width: 32px; text-align: right; font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }

/* ---------- 文案创作 ---------- */
.notice {
  display: flex; align-items: flex-start; gap: 8px;
  background: #EAFBF1;
  border: 1px solid #D2F3E0;
  color: #05803F;
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.55;
  margin-bottom: 4px;
}
.notice svg { flex: 0 0 auto; margin-top: 1px; }

.type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.type-card {
  background: #fff;
  border-radius: 16px;
  padding: 13px 12px;
  box-shadow: var(--shadow);
  cursor: pointer;
  border: 1px solid rgba(20,23,26,.02);
  transition: transform .15s ease;
  position: relative;
  overflow: hidden;
}
.type-card:active { transform: scale(.98); }
.type-icon {
  width: 36px; height: 36px;
  border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 9px;
}
.type-card h3 { font-size: 14px; font-weight: 650; }
.type-card p { font-size: 10.5px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
.type-arrow { position: absolute; right: 11px; top: 12px; color: #C9CDD4; }

/* ---------- 创作页 ---------- */
.compose-page { padding: 2px 16px 24px; }
.compose-page .field { margin-bottom: 14px; }
.compose-page .seg { margin-bottom: 16px; }
.compose-page .chips { margin-bottom: 16px; }
.compose-page .btn.block { margin-bottom: 8px; }
.field label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 7px; }
.input, .textarea, select.input {
  width: 100%;
  border: 1px solid var(--line);
  background: #fff;
  border-radius: 12px;
  padding: 13px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  outline: none;
  transition: border-color .18s;
}
.input:focus, .textarea:focus { border-color: rgba(7,193,96,.55); }
.textarea { resize: none; line-height: 1.75; }

/* 文案结构 + 写作提示卡片 */
.tip-card {
  background: #FAFBFC;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 16px;
}
.tip-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 4px 0;
  font-size: 13px;
  line-height: 1.6;
}
.tip-label {
  flex: 0 0 36px;
  font-size: 11.5px;
  color: var(--sub);
  font-weight: 600;
  padding-top: 1px;
}
.tip-val { color: #3B4148; flex: 1; min-width: 0; }
.tip-val b { color: var(--text); font-weight: 600; }

.seg {
  display: flex;
  background: #EDEFF2;
  border-radius: 11px;
  padding: 3px;
  gap: 3px;
}
.seg button {
  flex: 1;
  border: none;
  background: transparent;
  height: 32px;
  border-radius: 9px;
  font-size: 12.5px;
  color: #5A6068;
  font-family: inherit;
  cursor: pointer;
  transition: all .2s;
}
.seg button.active {
  background: #fff;
  color: var(--text);
  font-weight: 600;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  border: 1px solid #E6E8EB;
  background: #fff;
  color: #4A5057;
  font-size: 12px;
  padding: 6px 11px;
  border-radius: 999px;
  cursor: pointer;
  font-family: inherit;
  transition: all .16s;
  white-space: nowrap;
}
.chip:active { transform: scale(.97); }
.chip.active {
  background: #EAFBF1;
  border-color: rgba(7,193,96,.45);
  color: var(--green-dark);
  font-weight: 600;
}
.chip.small { padding: 4px 9px; font-size: 11px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: none;
  border-radius: 12px;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  height: 44px;
  padding: 0 16px;
  cursor: pointer;
  transition: transform .12s, opacity .18s;
}
.btn:active { transform: scale(.985); }
.btn.block { width: 100%; }
.btn.primary { background: var(--green); color: #fff; box-shadow: 0 6px 16px rgba(7,193,96,.24); }
.btn.primary:disabled { background: #C9CDD4; box-shadow: none; cursor: not-allowed; }
.btn.ghost { background: #fff; color: #333; border: 1px solid var(--line); }
.btn.soft { background: #EAFBF1; color: var(--green-dark); }
.btn.danger { background: var(--red); color: #fff; }
.btn.small { height: 34px; font-size: 12.5px; border-radius: 9px; padding: 0 12px; }
.btn-row { display: flex; gap: 8px; }
.btn-row .btn { flex: 1; }

/* 同步服务器：地址获取与连接测试 */
.server-actions { display: flex; gap: 8px; margin-top: 9px; }
.server-actions .btn { flex: 1; }
.server-test {
  margin-top: 9px;
  padding: 9px 11px;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.5;
  word-break: break-all;
}
.server-test.busy { background: #F2F3F5; color: #646A73; }
.server-test.ok { background: #EAFBF1; color: var(--green-dark); }
.server-test.fail { background: #FDECEC; color: #D93026; }

.result { margin-top: 14px; }
.result-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
.result-head h3 { font-size: 14px; font-weight: 650; }
.meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.meta span { font-size: 11px; color: var(--sub); background: #F5F6F8; padding: 3px 7px; border-radius: 6px; }
.meta .warn { color: #B36A00; background: #FFF4E5; }
.meta .ok { color: #05803F; background: #EAFBF1; }

.copy-text {
  font-size: 14.5px;
  line-height: 1.82;
  color: #191B1F;
  white-space: pre-wrap;
  word-break: break-word;
  letter-spacing: .1px;
}
.copy-text mark { background: #FFE1DD; color: #C4281C; padding: 0 2px; border-radius: 3px; font-weight: 600; }

.moment-preview {
  margin-top: 12px;
  border-radius: 12px;
  background: #fff;
  border: 1px solid #EEE;
  padding: 14px;
}
.moment-head { display: flex; gap: 9px; }
.moment-avatar {
  width: 38px; height: 38px; border-radius: 6px;
  background: linear-gradient(135deg,#2EAE72,#048346);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; flex: 0 0 auto;
}
.moment-name { font-size: 14.5px; color: #576B95; font-weight: 550; }
.moment-text { font-size: 14.5px; line-height: 1.75; color: #191919; margin-top: 6px; white-space: pre-wrap; word-break: break-word; }
.moment-fold { position: relative; max-height: 138px; overflow: hidden; }
.moment-fold::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 44px;
  background: linear-gradient(rgba(255,255,255,0), #fff);
}
.moment-more { color: #576B95; font-size: 13.5px; margin-top: 2px; }
.moment-foot { margin-top: 10px; padding-top: 9px; border-top: 1px solid #F2F2F2; font-size: 11px; color: #999; display: flex; justify-content: space-between; align-items: center; }

.fold-meter { display: flex; align-items: center; gap: 4px; }
.fold-meter i { width: 16px; height: 4px; border-radius: 2px; background: #E8E8EA; }
.fold-meter i.on { background: var(--green); }
.fold-meter i.warn { background: var(--orange); }

/* 合规面板 */
.compliance { border-radius: 14px; padding: 13px; margin-top: 12px; }
.compliance.pass { background: #EAFBF1; border: 1px solid #CFF1DE; }
.compliance.fail { background: var(--red-bg); border: 1px solid #FFD8D4; }
.comp-head { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 650; }
.compliance.pass .comp-head { color: #05803F; }
.compliance.fail .comp-head { color: #C4281C; }
.comp-desc { font-size: 11.5px; line-height: 1.6; margin-top: 5px; color: #565C63; }

.vio { margin-top: 10px; border-top: 1px dashed rgba(196,40,28,.18); padding-top: 10px; }
.vio:first-of-type { border-top: none; padding-top: 0; }
.vio-head { display: flex; align-items: center; gap: 6px; }
.vio-word { font-size: 12.5px; font-weight: 650; color: #C4281C; }
.vio-reason { font-size: 11.5px; color: #6B7078; line-height: 1.55; margin-top: 4px; }
.vio-fix { font-size: 11.5px; color: #05803F; margin-top: 3px; }

.replaced {
  margin-top: 10px;
  background: #fff;
  border-radius: 10px;
  padding: 10px;
  font-size: 12.5px;
  line-height: 1.7;
  color: #333;
  white-space: pre-wrap;
  border: 1px solid #D8F0E2;
}

.tag {
  display: inline-flex;
  align-items: center;
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 5px;
  font-weight: 600;
  white-space: nowrap;
}
.tag.red { background: #FFE7E4; color: #C4281C; }
.tag.orange { background: #FFF1DC; color: #A86400; }
.tag.green { background: #E3F8EC; color: #05803F; }
.tag.blue { background: #EAF1FF; color: #3A5FA8; }
.tag.gray { background: #F1F2F4; color: #777D85; }

.hint {
  font-size: 11.5px;
  color: var(--sub);
  line-height: 1.6;
  margin-top: 8px;
  display: flex;
  gap: 6px;
  align-items: flex-start;
}

/* ---------- 选题 ---------- */
.filter-scroll {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  padding: 2px 16px 12px;
  margin: 0 -16px;
  scrollbar-width: none;
}
.filter-scroll::-webkit-scrollbar { display: none; }

.topic-card {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 13px 14px;
  background: #fff;
  border-radius: 14px;
  box-shadow: var(--shadow);
  margin-bottom: 9px;
  cursor: pointer;
}
.topic-index {
  width: 26px; height: 26px; border-radius: 8px;
  background: #F2F7F4; color: var(--green-dark);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
}
.topic-body { flex: 1; min-width: 0; }
.topic-body h3 { font-size: 13.5px; font-weight: 550; line-height: 1.5; }
.topic-meta { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.topic-go { flex: 0 0 auto; color: #C4C8CE; align-self: center; }

/* ---------- 素材 ---------- */
.tabs {
  display: flex;
  gap: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}
.tabs button {
  border: none; background: transparent;
  font-size: 14px; color: var(--sub);
  padding: 8px 0 10px;
  font-family: inherit;
  cursor: pointer;
  position: relative;
}
.tabs button.active { color: var(--text); font-weight: 650; }
.tabs button.active::after {
  content: "";
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;
  width: 18px; height: 3px; border-radius: 2px; background: var(--green);
}

.material-item {
  background: #fff; border-radius: 13px; padding: 12px 13px;
  box-shadow: var(--shadow);
  margin-bottom: 8px;
}
.material-item .mt { font-size: 13.5px; line-height: 1.65; color: #22262B; }
.material-item .mf { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.material-item .mf span { font-size: 10.5px; color: #A6ABB2; }
.link-btn {
  border: none; background: transparent;
  color: var(--green-dark); font-size: 11.5px; font-family: inherit;
  cursor: pointer; padding: 2px 0;
}

.img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.img-card { position: relative; border-radius: 12px; overflow: hidden; background: #E9EAEC; aspect-ratio: 1/1; }
.img-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
.img-card .cap {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 16px 8px 6px;
  font-size: 10px; color: #fff;
  background: linear-gradient(transparent, rgba(0,0,0,.55));
}
.img-add {
  border: 1px dashed #D5D8DD; border-radius: 12px; background: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  color: #9AA0A7; font-size: 11.5px; cursor: pointer; aspect-ratio: 1/1;
  position: relative; overflow: hidden;
}

/* 透明覆盖的真实文件输入：点击区域整块可点，兼容 iOS/Android */
.file-cover {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer; z-index: 2;
}
.file-label { position: relative; overflow: hidden; }

.video-card {
  display: flex; gap: 10px; align-items: center;
  background: #fff; border-radius: 13px; padding: 11px; box-shadow: var(--shadow);
}
.video-thumb {
  width: 64px; height: 48px; border-radius: 8px; background: #14181D;
  display: flex; align-items: center; justify-content: center; color: #fff; flex: 0 0 auto;
}
.video-thumb.play { cursor: pointer; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .28); }

/* ---------- 图片 / 视频预览 ---------- */
.img-miss {
  display: flex; align-items: center; justify-content: center; height: 100%;
  background: #F0F0F0; color: #999; font-size: 11px;
}
.img-card { cursor: pointer; }
.preview-img, .preview-video {
  width: 100%; max-height: 58vh; border-radius: 12px; display: block;
  background: #0E1114; object-fit: contain;
}
.preview-empty {
  padding: 28px 12px; text-align: center; font-size: 12px; color: #9AA0A7;
  background: #F5F6F8; border-radius: 12px; line-height: 1.7;
}
.hist-media {
  width: 100%; max-height: 180px; object-fit: cover; border-radius: 10px;
  display: block; margin-top: 9px; background: #0E1114;
}
img.hist-media { cursor: pointer; }
.hist-media.none {
  display: flex; align-items: center; justify-content: center;
  height: 56px; font-size: 11.5px; color: #9AA0A7; background: #F5F6F8;
}
.api-box { margin-bottom: 12px; background: #F7F8FA; border-radius: 10px; padding: 10px 12px; }
.api-box summary { font-size: 12.5px; color: #3B4148; cursor: pointer; }
.api-box[open] summary { margin-bottom: 10px; }
.api-box .field:first-of-type { margin-top: 10px; }

/* ---------- 排期 ---------- */
.slot-card {
  background: #fff; border-radius: 14px; padding: 13px 14px; margin-bottom: 9px;
  box-shadow: var(--shadow);
  border-left: 3px solid #E9EAEC;
}
.slot-card.gold { border-left-color: var(--green); }
.slot-card.mini-gold { border-left-color: var(--orange); }
.slot-card.bed { border-left-color: var(--purple); }
.slot-top { display: flex; align-items: center; justify-content: space-between; }
.slot-t { font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.slot-desc { font-size: 11.5px; color: var(--sub); margin-top: 4px; line-height: 1.55; }
.slot-types { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.slot-act { margin-top: 9px; display: flex; align-items: center; justify-content: space-between; }
.slot-note { font-size: 11px; color: #9AA0A7; }

.ratio-big {
  display: flex; gap: 3px; height: 10px; border-radius: 5px; overflow: hidden; margin: 10px 0 8px;
}
.ratio-big i { height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 10.5px; color: var(--sub); }
.legend b { display: inline-block; width: 7px; height: 7px; border-radius: 2px; margin-right: 4px; }

/* ---------- 资料库 ---------- */
.profile-hero {
  position: relative;
  display: flex; align-items: center; gap: 13px;
  background: #fff; border-radius: 18px; padding: 16px; box-shadow: var(--shadow);
}
.profile-hero > div:nth-child(2) { min-width: 0; flex: 1; }
.profile-avatar {
  width: 54px; height: 54px; border-radius: 16px;
  background: linear-gradient(135deg,#2EAE72,#048346);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 23px; font-weight: 700;
  flex: 0 0 auto;
  box-shadow: 0 6px 14px rgba(7,193,96,.24);
}
.profile-name { font-size: 17px; font-weight: 700; }
.profile-tag { font-size: 11.5px; color: var(--sub); margin-top: 3px; }
.profile-badge {
  position: absolute; right: 14px; top: 14px;
  font-size: 10px; color: var(--green-dark);
  background: #EAFBF1; padding: 3px 7px; border-radius: 6px;
  white-space: nowrap;
}
.profile-badge.off { color: #B26B00; background: #FFF4E0; }
.profile-avatar img, .hero-avatar img, .moment-avatar img {
  width: 100%; height: 100%; object-fit: cover; display: block; border-radius: inherit;
}
.avatar-wrap { position: relative; flex: 0 0 auto; cursor: pointer; }
.avatar-edit {
  position: absolute; right: -3px; bottom: -3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #07C160; color: #fff;
  font-style: normal; font-size: 10px; line-height: 20px; text-align: center;
  border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(7,193,96,.3);
}
.prof-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

.persp { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.persp span {
  font-size: 11px; color: #3C444D;
  background: #F4F5F7; border-radius: 999px; padding: 5px 10px;
}

.section-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 2px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.section-item:last-child { border-bottom: none; }
.section-num {
  width: 28px; height: 28px; border-radius: 9px;
  background: #EAFBF1; color: var(--green-dark);
  font-size: 11px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.section-body { flex: 1; min-width: 0; }
.section-body b { font-size: 13.5px; font-weight: 550; display: block; }
.section-body span { font-size: 11px; color: var(--sub); }
.section-item svg { color: #C6CAD0; flex: 0 0 auto; }

/* ---------- 历史 / 拦截 ---------- */
.hist-item {
  background: #fff; border-radius: 14px; padding: 13px 14px; margin-bottom: 9px;
  box-shadow: var(--shadow);
}
.hist-top { display: flex; align-items: center; gap: 6px; }
.hist-top .time { margin-left: auto; font-size: 10.5px; color: #A9AEB5; }
.hist-text {
  font-size: 12.5px; color: #444A52; line-height: 1.65; margin-top: 8px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.hist-item.blocked { background: #FFF8F7; border: 1px solid #FFE3DF; }
.block-detail { margin-top: 9px; background: #fff; border-radius: 10px; padding: 10px; }
.block-row { font-size: 11.5px; line-height: 1.6; color: #565C63; margin-bottom: 6px; }
.block-row:last-child { margin-bottom: 0; }
.block-row b { color: #9A2B22; font-weight: 600; }
.block-row em { font-style: normal; color: #05803F; }

/* ---------- 合规检测页 ---------- */
.check-result { margin-top: 12px; }
.word-group { margin-bottom: 10px; }
.word-group h4 { font-size: 12px; font-weight: 650; margin: 10px 0 7px; color: #3B4148; }
.word-list { display: flex; flex-wrap: wrap; gap: 5px; }
.word-list span {
  font-size: 11px; color: #6B7078; background: #F4F5F7;
  padding: 4px 8px; border-radius: 6px;
}

/* ---------- 我的 ---------- */
.menu-card { background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 15px;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
}
.menu-item:last-child { border-bottom: none; }
.menu-icon {
  width: 30px; height: 30px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto;
}
.menu-item b { font-size: 13.5px; font-weight: 500; flex: 1; }
.menu-item span { font-size: 11px; color: #A9AEB5; }
.menu-item svg { color: #C6CAD0; }

/* ---------- 同步 ---------- */
.sync-hero {
  background: linear-gradient(135deg, #1C2B33, #0E1418);
  border-radius: 18px; padding: 16px; color: #fff;
  box-shadow: 0 10px 24px rgba(10,20,18,.24);
}
.sync-top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #37D67A; box-shadow: 0 0 0 3px rgba(55,214,122,.18); }
.sync-dot.off { background: #8A8F99; box-shadow: none; }
.sync-dot.busy { background: #FFB020; }
.sync-path { font-size: 11px; color: rgba(255,255,255,.55); margin-top: 7px; font-family: ui-monospace, Menlo, monospace; }
.sync-nums { display: flex; gap: 22px; margin-top: 14px; }
.sync-nums b { font-size: 20px; font-weight: 700; display: block; }
.sync-nums span { font-size: 10.5px; color: rgba(255,255,255,.55); }

.map-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 12px;
}
.map-row:last-child { border-bottom: none; }
.map-row span { color: #3B4148; }
.map-row em { font-style: normal; color: #A9AEB5; font-size: 10.5px; }

.switch { position: relative; width: 42px; height: 25px; flex: 0 0 auto; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i {
  position: absolute; inset: 0; background: #D9DCE0; border-radius: 999px; transition: .2s;
}
.switch i::after {
  content: ""; position: absolute; top: 2.5px; left: 2.5px;
  width: 20px; height: 20px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.18); transition: .2s;
}
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { transform: translateX(17px); }

/* ---------- 底部导航 ---------- */
.tabbar {
  flex: 0 0 auto;
  display: flex;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(14px);
  border-top: 1px solid #ECEDEF;
  padding: 5px 6px 4px;
  z-index: 30;
}
.tab {
  flex: 1;
  border: none; background: transparent;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 4px 0;
  color: #9AA0A7;
  font-family: inherit;
  cursor: pointer;
  transition: color .16s;
}
.tab span { font-size: 10px; letter-spacing: .2px; }
.tab.active { color: var(--green); font-weight: 600; }

.home-bar {
  height: 20px;
  flex: 0 0 20px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.96);
}
.home-bar i { width: 118px; height: 4px; border-radius: 3px; background: #111; opacity: .85; }

/* ---------- 底部弹层 ---------- */
.sheet-mask {
  position: absolute; inset: 0; background: rgba(12,15,18,.42);
  z-index: 60; display: flex; align-items: flex-end;
  animation: fadeIn .2s ease;
}
.sheet {
  width: 100%;
  background: #fff;
  border-radius: 20px 20px 0 0;
  padding: 8px 16px 20px;
  max-height: 88%;
  overflow-y: auto;
  animation: slideUp .26s cubic-bezier(.22,.7,.3,1);
  scrollbar-width: none;
}
.sheet::-webkit-scrollbar { display: none; }
.sheet-handle { width: 34px; height: 4px; border-radius: 2px; background: #E3E5E8; margin: 2px auto 14px; }
.sheet h3 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.sheet .field { margin-bottom: 12px; }
.sheet-actions { display: flex; gap: 8px; margin-top: 6px; }
.sheet-actions .btn { flex: 1; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(24px); opacity: .6; } to { transform: translateY(0); opacity: 1; } }

.toast {
  position: absolute;
  left: 50%; bottom: 92px;
  transform: translateX(-50%) translateY(8px);
  background: rgba(20,23,26,.9);
  color: #fff;
  font-size: 12.5px;
  padding: 9px 15px;
  border-radius: 999px;
  z-index: 80;
  opacity: 0;
  pointer-events: none;
  transition: all .22s ease;
  max-width: 80%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty {
  text-align: center;
  padding: 38px 10px;
  color: #A9AEB5;
  font-size: 12px;
  line-height: 1.7;
}
.empty .e-icon {
  width: 46px; height: 46px; border-radius: 14px; background: #fff;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 10px; color: #C6CAD0;
  box-shadow: var(--shadow);
}

.gen-loading { padding: 22px 4px; }
.gen-loading i {
  display: block; height: 10px; border-radius: 5px; margin-bottom: 9px;
  background: linear-gradient(90deg, #F0F1F3 25%, #F7F8FA 37%, #F0F1F3 63%);
  background-size: 400% 100%;
  animation: shimmer 1.2s ease infinite;
}
.gen-loading i:nth-child(1) { width: 92%; }
.gen-loading i:nth-child(2) { width: 100%; }
.gen-loading i:nth-child(3) { width: 86%; }
.gen-loading i:nth-child(4) { width: 64%; }
@keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

.divider { height: 1px; background: var(--line); margin: 14px 0; }
.mt8 { margin-top: 8px; }
.mt12 { margin-top: 12px; }
.mt16 { margin-top: 16px; }
.muted { color: var(--sub); font-size: 11.5px; line-height: 1.6; }

/* ---------- 手机端真机适配（视口 ≤ 520px） ---------- */
@media (max-width: 520px) {
  html, body { height: 100%; }
  body {
    background: var(--bg);
    min-height: 100vh;
    min-height: 100dvh;
    display: block;
    align-items: stretch;
    justify-content: stretch;
    overflow: hidden;
  }
  .stage {
    padding: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
  }
  .device {
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    border-radius: 0;
    padding: 0;
    background: var(--bg);
    box-shadow: none;
  }
  .screen { border-radius: 0; }
  .island { display: none; }
  .home-bar { display: none; }
  .statusbar {
    height: calc(40px + env(safe-area-inset-top, 0px));
    flex-basis: calc(40px + env(safe-area-inset-top, 0px));
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: 6px;
  }
  .tabbar {
    padding: 6px 6px calc(4px + env(safe-area-inset-bottom, 0px));
  }
  /* 弹层适配安全区 */
  .sheet { padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); }
  .toast { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  /* 内容区与触控热区微调 */
  .page { padding: 2px 14px 18px; }
  .btn { min-height: 44px; font-size: 14px; }
  .icon-btn { width: 40px; height: 40px; }
  .chip { min-height: 30px; font-size: 12.5px; }
  .card { padding: 13px; }
}

/* 小高度桌面预览 */
@media (max-height: 700px) and (min-width: 521px) {
  .device { border-radius: 42px; }
  .screen { border-radius: 34px; }
}

/* 合规检测 · 规则依据 */
.rules-card { display: flex; flex-direction: column; gap: 9px; }
.rule-item { padding: 10px 12px; background: #F7F8FA; border-radius: 10px; }

.rule-date { font-size: 10.5px; color: #3A7A4F; margin-top: 4px; }

/* 创作 · 篇幅选择 */

/* ---------- Android 独立 App ---------- */

/* 合规检测 · 规则自动更新 */

/* 素材库 · 图片角标 */

  /* ---------- 合规检测 ---------- */
  function checkText(text) {

    });

  // 图片合规浅检测（文件 File 或 {name, type, size, width, height, exif}）

      v.push({ word: name, category: "双后缀", reason: "文件名带双后缀（如 xxx.jpg.xxx），可疑文件", suggestion: "只保留真实后缀" });
    }

    // 6. EXIF 作者/软件/相机型号 / GPS（仅浏览器 File 版，Android 原生不支持 EXIF 解析）
    if (file && file instanceof File && file.type && file.type.startsWith("image/")) {
      try {
        const arrBuf = await file.slice(0, 65536).arrayBuffer();
        const exif = parseExifPreview(new Uint8Array(arrBuf));
        if (exif && exif.Software && /(微信|QQ|抖音|快手|微博|小红书|淘宝|拼多多)/i.test(exif.Software)) {
          v.push({ word: exif.Software, category: "多平台来源", reason: "EXIF 显示图片来自" + exif.Software + "，直接转发可能被朋友圈降权", suggestion: "导出重压缩后再发，或确认自己有使用权限" });
        }
        if (exif && exif.Artist && checkText(exif.Artist).violations.length) {
          v.push({ word: exif.Artist, category: "EXIF 作者违规", reason: "图片内置的作者字段含违规词", suggestion: "清除 EXIF 后再发" });
        }
      } catch (e) { /* 非 JPEG 没 EXIF，跳过 */ }
    }

    const pass = !v.some((x) => x.category === "可执行文件" || x.category === "双后缀");
    return { passed: pass, count: v.length, violations: v, media: { kind: "image", file: name, type, size, width, height } };
  }

  // 视频合规浅检测
  async function checkVideo(file, desc) {
    const v = [];
    const name = file && file.name ? file.name : "";
    const size = file && typeof file.size === "number" ? file.size : 0;
    const type = file && file.type ? file.type.toLowerCase() : "";
    const words = [name, desc || ""].filter(Boolean).join(" ");

    const t0 = checkText(words);
    if (t0.violations && t0.violations.length) {
      t0.violations.forEach((vi) =>
        v.push({ word: vi.word, category: vi.category, reason: "文件名/描述命中：" + vi.reason, suggestion: vi.suggestion }));
    }

    if (type && !/video\/(mp4|quicktime|webm|x-m4v)/i.test(type)) {
      v.push({ word: type, category: "格式风险", reason: "朋友圈仅支持 MP4，" + type.replace("video/","").toUpperCase() + " 不会被识别", suggestion: "转为 H.264 MP4" });
    }

    const MB = 1024 * 1024;
    if (size && size > 50 * MB) {
      v.push({ word: (size / MB).toFixed(1) + "MB", category: "文件过大", reason: "朋友圈视频上限约 50MB，超过会上传失败", suggestion: "压缩到 50MB 内" });
    }

    let duration = 0;
    if (file && file instanceof File && file.type && file.type.startsWith("video/")) {
      try {
        const url = URL.createObjectURL(file);
        const el = document.createElement("video");
        el.preload = "metadata";
        await new Promise((res, rej) => {
          el.onloadedmetadata = () => res();
          el.onerror = rej;
          el.src = url;
        });
        duration = isFinite(el.duration) ? el.duration : 0;
        URL.revokeObjectURL(url);
      } catch (e) { /* 跳过 */ }
    }
    if (duration > 30) {
      v.push({ word: Math.round(duration) + "s", category: "超时", reason: "朋友圈视频建议 ≤30 秒，超过会被平台降权甚至不推荐", suggestion: "剪到 30 秒内" });
    }
    if (duration > 60) {
      v.push({ word: Math.round(duration) + "s", category: "严重超时", reason: "视频超过 60 秒很可能上传失败或被折叠成链接", suggestion: "剪到 30 秒内" });
    }

    if (/\.(exe|bat|cmd|vbs|scr|com)\b/i.test(name)) {
      v.push({ word: name, category: "可执行文件", reason: "文件名带可执行后缀，朋友圈禁止传播", suggestion: "只允许视频后缀" });
    }

    const pass = !v.some((x) => /^严重超|可执行文件/i.test(x.category));
    return { passed: pass, count: v.length, violations: v, media: { kind: "video", file: name, type, size, duration } };
  }

  // 极简 EXIF 预览：只解析 JPEG SOI + APP1 里的 TIFF IFD 前几个常用字段
  function parseExifPreview(bytes) {
    try {
      if (bytes.length < 2) return null;
      // JPEG SOI marker
      if (!(bytes[0] === 0xFF && bytes[1] === 0xD8)) return null;
      // 找 APP1 marker (0xFFE1)
      let i = 2;
      while (i < bytes.length - 3) {
        if (bytes[i] === 0xFF && bytes[i + 1] === 0xE1) break;
        i += 2 + ((bytes[i + 2] << 8) | bytes[i + 3]);
      }
      if (i >= bytes.length - 4) return null;
      const len = (bytes[i + 2] << 8) | bytes[i + 3];
      const tiffStart = i + 8;
      if (bytes[tiffStart] !== 0x49 || bytes[tiffStart + 1] !== 0x49) return null; // 非 II little-endian
      const little = bytes[tiffStart] === 0x49;
      const u16 = (o) => little ? (bytes[o + 1] << 8 | bytes[o]) : (bytes[o] << 8 | bytes[o + 1]);
      const u32 = (o) => little ? (bytes[o + 3] << 24 | bytes[o + 2] << 16 | bytes[o + 1] << 8 | bytes[o])
                                : (bytes[o] << 24 | bytes[o + 1] << 16 | bytes[o + 2] << 8 | bytes[o + 3]);
      const firstIFD = u32(tiffStart + 4) + tiffStart;
      const count = u16(firstIFD);
      const out = {};
      for (let j = 0; j < count; j++) {
        const e = firstIFD + 2 + j * 12;
        const tag = u16(e);
        const type = u16(e + 2);
        if (type !== 2) continue; // 只处理 ASCII
        const num = u32(e + 4);
        const valOff = u32(e + 8);
        const strStart = num <= 4 ? e + 8 : (tiffStart + valOff);
        let s = "";
        for (let k = 0; k < num - 1 && (strStart + k) < bytes.length; k++) {
          const b = bytes[strStart + k];
          if (b === 0) break;
          s += String.fromCharCode(b);
        }
        if (tag === 0x010F) out.Make = s;
        else if (tag === 0x0110) out.Model = s;
        else if (tag === 0x0131) out.Software = s;
        else if (tag === 0x013B) out.Artist = s;
        else if (tag === 0x010E) out.ImageDescription = s;
      }
      return out;
    } catch (e) { return null; }
  }

  /* ---------- 防折叠 ---------- */
  function foldInfo(text) {
    const raw = String(text || "");
    const chars = [...raw.replace(/\s/g, "")].length;
    let lines = 0;
    raw.split("\n").forEach((p) => {
      lines += p.trim() ? Math.ceil([...p].length / 19) : 1;
    });
    const folded = lines > 6;
    return {
      chars,
      lines,
      folded,
      risk: lines > 8 ? "高" : folded ? "中" : "低",
      advice: folded
        ? "超过 6 行会被折叠，建议缩短到 6 行内，或把钩子放在前两行"
        : "预计完整展示，无需折叠处理"
    };
  }

      return "这个月主要在忙「" + t + "」，到今天算是告一段落。\n\n" + pick(p.result, v) + "\n\n" + pick(p.problem, v) + "\n\n" + pick(p.next, v);
    }
    if (typeId === "case") {
      return "说个「" + t + "」的真实过程。\n\n" + pick(p.before, v) + "\n\n" + pick(p.after, v) + "\n\n" + pick(p.why, v) + "\n\n" + pick(p.close, v);
    }
    if (typeId === "product") {
      return t + "？先说清楚我为什么做这件事。\n\n" + pick(p.problem, v) + "\n\n" + pick(p.value, v) + "\n\n" + pick(p.who, v) + "\n\n" + pick(p.join, v);
    }
    if (typeId === "book") {
      return "关于「" + t + "」，想聊几句。\n\n" + pick(p.insight, v) + "\n\n" + pick(p.impact, v) + "\n\n" + pick(p.action, v);
    }
    if (typeId === "exp") {
      return "聊聊「" + t + "」。\n\n" + pick(p.bg, v) + "\n\n" + pick(p.pit, v) + "\n\n" + pick(p.summary, v) + "\n\n" + pick(p.advice, v);
    }
    return "聊聊「" + t + "」。\n\n" + pick(p.bg, v);
  }

  const CASUAL = {
    因此: "所以", 并且: "而且", 此外: "还有", 进行: "做", 已经: "都",
    非常: "特别", 然而: "不过", 例如: "比如", 如果: "要是", 是否: "是不是",
    应当: "该", 具备: "有", 从而: "这样", 基于: "按"
  };
  const DEAI = [
    ["不得不说，", ""], ["值得一提的是，", ""], ["综上所述，", ""],
    ["在这个快速发展的时代，", ""], ["让我们一起", "一起"], ["赋能", "帮上忙"],
    ["闭环", "跑通"], ["抓手", "办法"], ["底层逻辑", "根本原因"], ["首先，", ""],
    ["其次，", ""], ["最后，", ""], ["其实，", ""]
  ];
  const SOFT = [
    ["私信我", "评论区聊聊"], ["私聊我", "评论区留言"], ["加微信", "评论区聊"],
    ["下单", "了解"], ["报名", "了解"], ["购买", "看看"], ["限时抢购", "近期"],
    ["秒杀", "限时"], ["免费领取", "可以分享"], ["微信号", "评论区"]
  ];

  function applyStyles(text, styles) {
    let t = text;
    const has = (s) => styles.indexOf(s) >= 0;

    if (has("deai") || has("casual")) {
      DEAI.forEach(([a, b]) => { t = t.split(a).join(b); });
    }
    if (has("casual")) {
      Object.keys(CASUAL).forEach((k) => { t = t.split(k).join(CASUAL[k]); });
    }
    if (has("softsell")) {
      SOFT.forEach(([a, b]) => { t = t.split(a).join(b); });
    }
    if (has("real")) {
      t = t.replace(/\n\n([^\n]+)$/, "\n\n$1");
      t = t.replace(/\n\n([^\n]+)$/, "\n\n写完这段，窗外已经安静下来，屋里只剩台灯亮着。\n\n$1");
    }
    if (has("emotion")) {
      t = t.replace(/\n\n([^\n]+)$/, "\n\n说这些不是矫情，是真的很珍惜现在的生活。\n\n$1");
    }
    if (has("like")) {
      t = t.replace(/\n\n([^\n]+)$/, "\n\n都是我自己踩过的路，不一定对，但真实。\n\n$1");
    }
    t = t.replace(/\n{3,}/g, "\n\n").trim();
    return t;
  }

  function polish(text, size) {
    let t = String(text || "").replace(/\r/g, "").replace(/[ \t]+\n/g, "\n").trim();
    DEAI.forEach(([a, b]) => { t = t.split(a).join(b); });
    Object.keys(CASUAL).forEach((k) => { t = t.split(k).join(CASUAL[k]); });
    if (size === "short") {
      // 短文：合并空行，压缩行数，降低折叠概率
      t = t.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean).join("\n");
    } else if (size === "long") {
      // 长文：长句按句号断行，方便手机上阅读
      t = t.split("\n").map((line) => wrapLine(line, 52)).join("\n");
    }
    return t;
  }

  function wrapLine(line, max) {
    const chars = [...line];
    if (chars.length <= max) return line;
    let out = "";
    let buf = "";
    chars.forEach((ch) => {
      buf += ch;
      if ([...buf].length >= max && /[。！？；]/.test(ch)) {
        out += buf + "\n";
        buf = "";
      }
    });
    return (out + buf).trim();
  }

  function shorten(text) {
    const paras = String(text || "").split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
    if (!paras.length) return "";
    let out = paras.slice(0, 2).join("\n\n");
    if ([...out.replace(/\s/g, "")].length <= SHORT_MAX) return out;
    // 超长时按句号截断，保证语义完整
    const sentences = out.match(/[^。！？]*[。！？]/g) || [out];
    let acc = "";
    for (let i = 0; i < sentences.length; i++) {
      if ([...acc.concat(sentences[i]).replace(/\s/g, "")].length > SHORT_MAX) break;
      acc += sentences[i];
    }
    return (acc.trim() || sentences[0].trim());
  }

  function longify(typeId, text, v) {
    const extra = pick(LONG_EXTRA[typeId] || LONG_EXTRA.life, v);
    const paras = String(text || "").split(/\n{2,}/).map((p) => p.trim()).filter(Boolean);
    paras.splice(Math.min(2, paras.length), 0, extra);
    return paras.join("\n\n");
  }

  function generate(typeId, topic, variant, styles, materialIds, size) {
    const p = persona();
    const st = (styles || []).slice();
    applyPersonaStyles(st, p);
    let text = baseGenerate(typeId, topic, variant);
    text = personalize(text, typeId, p);
    text = applyStyles(text, st);
    if (size === "long") text = longify(typeId, text, variant);
    if (size === "short") text = shorten(text);
    if (materialIds && materialIds.length) {
      materialIds.slice(0, 2).forEach((id) => {
        const m = store.materials.copy.find((x) => x.id === id);
        if (m) text += "\n\n「" + m.text + "」";
      });
    }
    return text;
  }

  /* ---------- 工具 ---------- */
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  const pad = (n) => (n < 10 ? "0" + n : "" + n);

  /* 联网校时：用服务端时间校准本地时间，避免手机时间不准导致日期/排期错乱 */
  let serverOffset = 0; // 服务端时间 - 本地时间（毫秒）
  function now() { return new Date(Date.now() + serverOffset); }
  function syncServerTime(dateHeader) {
    try {
      const t = Date.parse(dateHeader);
      if (!isNaN(t)) serverOffset = t - Date.now();
    } catch (e) {}
  }
  function nowISO() {
    const d = now();
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function todayKey() { return nowISO().slice(0, 10); }

  /* ---------- 每日轮换：选题 / 排期（按手机本地日期，0 点自动刷新，跨天不重复） ---------- */
  function seededRand(seed) {
    let h = 2166136261;
    for (let i = 0; i < seed.length; i++) {
      h ^= seed.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return () => {
      h += 0x6D2B79F5;
      let t = h;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // 每天 0 点（或跨天首次打开）刷新：今日选题互不重复，且跨天尽量不复用近期用过的选题
  function ensureDaily() {
    const today = todayKey();
    if (store.dailyDate === today) return;
    const all = (store.topics || []).map((t) => t.id);
    if (!all.length) { store.dailyDate = today; return; }
    const recent = new Set(store.recentTopicIds || []);
    let fresh = all.filter((id) => !recent.has(id));
    const need = Math.min((store.slots || []).length, all.length);
    if (fresh.length < need) fresh = all.slice();

    const rnd = seededRand(today + "|" + (store.topicCycle || 0));
    for (let i = fresh.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [fresh[i], fresh[j]] = [fresh[j], fresh[i]];
    }

    const todayIds = fresh.slice(0, need);
    store.todayTopics = todayIds;

    // 跨天去重：把今日选题计入近期使用；超过阈值才开始新一轮轮换
    store.recentTopicIds = (store.recentTopicIds || []).slice();
    todayIds.forEach((id) => {
      const idx = store.recentTopicIds.indexOf(id);
      if (idx >= 0) store.recentTopicIds.splice(idx, 1);
      store.recentTopicIds.push(id);
    });
    const cap = Math.max(all.length, Math.ceil(all.length * 0.7));
    if (store.recentTopicIds.length > cap) {
      store.recentTopicIds = store.recentTopicIds.slice(-cap);
      store.topicCycle = (store.topicCycle || 0) + 1;
    }

    // 今日排期：每个时段分配一条今日选题（当天内容互不重复），并生成可编辑的完整文案
    store.schedule = (store.slots || []).map((slot, i) => {
      const tid = todayIds[i % todayIds.length];
      const topic = store.topics.find((t) => t.id === tid);
      const typeName = (slot.types[0] || "").replace("（克制）", "");
      const type = store.types.find((x) => x.name === typeName) || store.types[0];
      const topicTitle = topic ? topic.title : type.defaultTopic;
      const typeId = topic ? topic.type : type.id;
      const text = generate(typeId, topicTitle, (i + 1) * 7 + todayIds.length, [], [], "short");
      return {
        slotId: slot.id,
        topicId: tid || "",
        status: "待发布",
        type: typeId,
        text: text.replace(/\n/g, " ").slice(0, 40),
        content: text,
        time: slot.time.split("-")[0]
      };
    });
    store.dailyDate = today;
    save();
  }

  function todayTopicList() {
    ensureDaily();
    const ids = store.todayTopics || [];
    return ids.map((id) => (store.topics || []).find((t) => t.id === id)).filter(Boolean);
  }

  function timeAgo(iso) {
    if (!iso) return "";
    const t = new Date(iso.replace(/-/g, "/")).getTime();
    const diff = (Date.now() - t) / 1000;
    if (diff < 60) return "刚刚";
    if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
    if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
    if (diff < 86400 * 2) return "昨天 " + iso.slice(11, 16);
    return iso.slice(5, 10) + " " + iso.slice(11, 16);
  }
  function typeById(id) { return store.types.find((t) => t.id === id); }
  function topicById(id) { return (store.topics || []).find((t) => t.id === id); }
  function slotById(id) { return (store.slots || []).find((s) => s.id === id); }
  function uid(prefix) { return prefix + Date.now().toString(36).slice(-5) + Math.random().toString(36).slice(2, 5); }

  /* ---------- 审计日志：所有增删改留痕 ---------- */
  // type: topic/slot/material/compose/schedule/profile/account/member/sync/archive
  // action: create/edit/delete/copy/assign/clear/login/signup/renew/push/pull
  function logAudit(type, action, target, detail) {
    if (!Array.isArray(store.auditLog)) store.auditLog = [];
    const entry = {
      id: uid("a"),
      ts: nowISO(),
      type: type || "",
      action: action || "",
      target: target ? String(target).slice(0, 80) : "",
      detail: detail ? String(detail).slice(0, 200) : ""
    };
    store.auditLog.unshift(entry);
    // 只保留最近 500 条，避免无限增长
    if (store.auditLog.length > 500) store.auditLog = store.auditLog.slice(0, 500);
    return entry;
  }
  function auditList(filterType) {
    const list = Array.isArray(store.auditLog) ? store.auditLog : [];
    return filterType ? list.filter((x) => x.type === filterType) : list;
  }

  /* ---------- 选题 CRUD ---------- */
  function addTopic(direction, title, type) {
    const t = { id: uid("t"), direction: direction || "自定义", title: title, type: type || "life", createdAt: nowISO(), custom: true };
    (store.topics || (store.topics = [])).unshift(t);
    logAudit("topic", "create", title, "方向：" + t.direction);
    save();
    return t;
  }
  function updateTopic(id, patch) {
    const t = topicById(id);
    if (!t) return null;
    const before = t.title;
    Object.assign(t, patch || {});
    t.updatedAt = nowISO();
    logAudit("topic", "edit", t.title, before + " → " + t.title);
    save();
    return t;
  }
  function deleteTopic(id) {
    const t = topicById(id);
    if (!t) return false;
    (store.topics || []).splice((store.topics || []).indexOf(t), 1);
    // 从今日选题和排期中移除
    if (Array.isArray(store.todayTopics)) {
      store.todayTopics = store.todayTopics.filter((x) => x !== id);
    }
    (store.schedule || []).forEach((s) => { if (s.topicId === id) { s.topicId = ""; s.text = ""; s.type = ""; s.content = ""; s.status = "待排"; } });
    logAudit("topic", "delete", t.title, "方向：" + t.direction);
    save();
    return true;
  }
  function copyTopic(id) {
    const t = topicById(id);
    if (!t) return null;
    const nt = { id: uid("t"), direction: t.direction, title: t.title + "（副本）", type: t.type, createdAt: nowISO(), custom: true };
    (store.topics || (store.topics = [])).unshift(nt);
    logAudit("topic", "copy", nt.title, "复制自：" + t.title);
    save();
    return nt;
  }

  /* ---------- 时段 CRUD ---------- */
  function addSlot(time, level, title, scene, types) {

      id: uid("s"),
      time: time || "00:00-01:00",
      level: level || "常规",
      title: title || "自定义时段",

    };

  function updateSlot(id, patch) {

    logAudit("slot", "edit", sl.time, before + " → " + sl.time + " " + sl.title);

  function deleteSlot(id) {

    (store.schedule || []).forEach((s) => { if (s.slotId === id) { s.topicId = ""; s.text = ""; s.type = ""; s.content = ""; s.status = "待排"; } });
    logAudit("slot", "delete", sl.time, sl.title);
    save();

  }

  /* ---------- 排期内容生成：为时段生成可编辑的完整文案 ---------- */
  function generateScheduleContent(slotId) {
    const slot = slotById(slotId);
    if (!slot) return "";
    const item = (store.schedule || []).find((x) => x.slotId === slotId);
    if (!item) return "";
    const typeId = item.type || (slot.types[0] && store.types.find((t) => t.name === slot.types[0].replace("（克制）", "")) && store.types.find((t) => t.name === slot.types[0].replace("（克制）", "")).id) || "life";
    const topic = item.topicId ? (topicById(item.topicId) || {}).title : item.text || typeById(typeId).defaultTopic;
    const text = generate(typeId, topic, Date.now() % 997, [], [], "short");
    item.content = text;
    item.text = text.replace(/\n/g, " ").slice(0, 40);
    item.status = "待发布";
    logAudit("schedule", "generate", slot.time, topic);
    save();
    return text;
  }
  /* ---------- 个人资料（按账号隔离，注册后由用户填写） ---------- */
  function blankSections() {
    return clone(window.SEED.profileSections);
  }
  function summaryOf(content) {
    const t = String(content || "").replace(/\s+/g, " ").trim();
    if (!t) return "待填写";
    return t.length > 18 ? t.slice(0, 18) + "…" : t;
  }
  function syncSummaries() {
    (store.profileSections || []).forEach((s) => { s.summary = summaryOf(s.content); });
    if (!store.user) store.user = { name: "", avatar: "", tagline: "", perspectives: [] };
    if (!store.user.perspectives) store.user.perspectives = [];
  }

  function bindProfile(phone, nickname) {
    if (!phone) return;
    const p = (store.profiles && store.profiles[phone]) || null;
    if (p && p.sections) {
      const base = blankSections();
      store.profileSections = base.map((s) => {
        const old = (p.sections || []).find((x) => x.id === s.id) || {};
        return Object.assign({}, s, { content: String(old.content || "") });
      });
      store.user = Object.assign({ name: "", avatar: "", tagline: "", perspectives: [] }, p.user || {});
    } else {
      store.user = { name: nickname || "", avatar: "", tagline: "", perspectives: [] };
      store.profileSections = blankSections();
    }
    if (nickname) store.user.name = nickname;
    store.currentPhone = phone;
    syncSummaries();
    save();
  }

  function saveProfile() {
    syncSummaries();
    if (store.currentPhone) {
      if (!store.profiles) store.profiles = {};
      store.profiles[store.currentPhone] = {
        user: store.user,
        sections: store.profileSections.map((s) => ({ id: s.id, content: s.content }))
      };
    }
    save();
  }

  function hasProfile() {
    const u = store.user || {};
    return !!(u.name || u.tagline || (u.perspectives && u.perspectives.length) ||
      (store.profileSections || []).some((s) => s.content));
  }

  function persona() {
    const u = store.user || {};
    const map = {};
    (store.profileSections || []).forEach((s) => { map[s.id] = String(s.content || "").trim(); });
    const firstLine = (k) => (map[k] || "").split(/\n+/).map((x) => x.trim()).filter(Boolean)[0] || "";
    const persp = (u.perspectives || []).filter(Boolean);
    return {
      name: u.name || "",
      avatar: u.avatar || "",
      tagline: u.tagline || "",
      perspectives: persp,
      identity: persp[0] || firstLine("who") || u.tagline || "",
      who: map.who || "",
      client: firstLine("client"),
      product: firstLine("product"),
      style: map.style || "",
      avoid: map.avoid || "",
      samples: map.samples || "",
      manual: firstLine("manual"),
      sections: map
    };
  }

  /* 选题：有资料就用用户的身份/产品/客户生成，没有则回落到通用选题 */
  function topicFor(typeId) {
    const t = typeById(typeId) || { defaultTopic: "" };
    const p = persona();
    if (!hasProfile()) return t.defaultTopic;
    const tag = p.perspectives[0] || p.tagline || p.identity;
    const prod = String(p.product || "").replace(/^[·•\-–\d.、\s]+/, "").replace(/[（(].*?[)）]/g, "").trim();
    if (typeId === "life" && tag) return tag + "的普通一天";
    if (typeId === "view" && tag) return tag + "：我最近想明白的一件事";
    if (typeId === "howto" && tag) return "作为" + tag + "，我最常用的 3 个方法";
    if (typeId === "review" && tag) return tag + "这个月的复盘";
    if (typeId === "case" && prod) return "我用「" + prod.slice(0, 12) + "」的一个真实案例";
    if (typeId === "product" && prod) return "我的「" + prod.slice(0, 12) + "」到底适合谁";
    if (typeId === "exp" && tag) return tag + "踩过的 3 个坑";
    if (typeId === "book" && p.manual) return "从「" + p.manual.slice(0, 10) + "」说起";
    return t.defaultTopic;
  }

  const clampLine = (s, n) => {
    const t = String(s || "").replace(/\s+/g, " ").trim();
    return t.length > n ? t.slice(0, n) + "…" : t;
  };

  /* 把资料库内容注入文案：身份、产品、客户、标签 */
  function personalize(text, typeId, p) {
    const extra = [];
    const role = String(p.identity || "").replace(/^(我是一名|我是一个|我是|作为一名|作为一个|作为|一个)/, "").trim();
    if (typeId === "life" && role) {
      extra.push("作为一名" + clampLine(role, 22) + "，平时节奏不算慢，但这些小事是我给自己留的空白。");
    }
    if (typeId === "howto" && role) {
      extra.push("作为" + clampLine(role, 22) + "，这几条是我一直在用、也真的有效的办法。");
    }
    if (typeId === "review" && role) {
      extra.push("作为" + clampLine(role, 22) + "，这个月最大的变化不是数据，而是节奏。");
    }
    if (typeId === "book" && role) {
      extra.push("作为" + clampLine(role, 22) + "，这本书里有一句话，正好说中了我最近的状态。");
    }
    if ((typeId === "view" || typeId === "exp") && p.name && p.identity) {
      extra.push("我是" + p.name + "，" + clampLine(p.identity, 22) + "。");
    }
    if ((typeId === "product" || typeId === "case") && p.product) {
      extra.push("我在做的方向是：" + clampLine(p.product, 36) + "。");
    }
    if ((typeId === "product" || typeId === "case") && p.client) {
      extra.push("如果你也是" + clampLine(p.client, 26) + "，这条大概对你有用。");
    }
    if (!extra.length) return text;
    const parts = String(text || "").split(/\n{2,}/);
    const head = parts.shift() || "";
    return head + "\n\n" + extra.join("\n\n") + (parts.length ? "\n\n" + parts.join("\n\n") : "");
  }

  /* 表达风格 / 避坑偏好 → 自动调节文风 */
  function applyPersonaStyles(list, p) {
    const add = (s) => { if (list.indexOf(s) < 0) list.push(s); };
    const like = p.style || "";
    const avoid = p.avoid || "";
    if (/口语|接地气|通俗|直白/.test(like)) add("casual");
    if (/真实|情感|故事/.test(like)) add("real");
    if (/AI\s*味|AI味|机器味/.test(avoid)) add("deai");
    if (/硬广|广告|推销/.test(avoid)) add("softsell");
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
    } catch (e) {
      return false;
    }
    // 本地保存成功后再通知云端做防抖推送（未配置/未登录时为空操作）
    try { if (window.Cloud && window.Cloud.markDirty) window.Cloud.markDirty(); } catch (e) {}
    return true;
  }

  /* ---------- 在线规则库（服务端每日 0 点抓取官方规则） ---------- */
  function applyLiveRules(live) {
    if (!live || !live.version) return false;
    if (live.version === store.rulesLiveVersion) return false;
    if (live.rules && live.rules.length) store.rules = live.rules;
    let added = 0;
    (live.newWords || []).forEach((nw) => {
      if (!nw || !nw.w) return;
      if (store.words.some((x) => x.w === nw.w)) return;
      store.words.push({ w: nw.w, c: nw.c || "虚假宣传", s: nw.s || "更稳妥的表述", auto: true });
      added++;
    });
    store.rulesLiveVersion = live.version;
    store.rulesCheckedAt = live.checkedAt || nowISO();
    store.rulesUpdatedAt = (live.sources || []).reduce((acc, s) => (s.updatedAt > acc ? s.updatedAt : acc), "");
    store.rulesAdded = (store.rulesAdded || 0) + added;
    save();
    return true;
  }

  window.Core = {
    store, ui, save, checkText, replaceText, highlight, foldInfo,
    checkImage, checkVideo,
    generate, polish, applyStyles, escapeHtml, nowISO, todayKey, now, syncServerTime,
    timeAgo, typeById, topicById, slotById, uid, DEFAULTS, SIZE_LABEL, SHORT_MAX, applyLiveRules,
    CATEGORY_REASON, LEGACY_COPY_TYPE,
    bindProfile, saveProfile, hasProfile, persona, topicFor, syncSummaries, blankSections,
    ensureDaily, todayTopicList,
    logAudit, auditList,
    addTopic, updateTopic, deleteTopic, copyTopic,
    addSlot, updateSlot, deleteSlot,
    generateScheduleContent
  };
})();

<script>
/* 页面：工作台 + 文案创作入口 */
(function () {
  const { store, ui } = Core;

  function greeting() {
    const h = Core.now().getHours();
    if (h < 6) return "凌晨好";
    if (h < 11) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }

  function dateLine() {
    const d = Core.now();
    const week = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
    return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · " + week;
  }

  function renderHome() {
    const pendingSync = (ui.sync.pending || []).length;
    const slots = store.slots;
    const today = store.schedule || [];
    const sentCount = today.filter((x) => x.status === "已发布").length;
    const todoCount = today.filter((x) => x.status !== "已发布").length;
    const blocked = store.blocks.length;

    const slotRows = today.slice(0, 3).map((item) => {
      const slot = slots.find((s) => s.id === item.slotId) || {};
      const t = Core.typeById(item.type);
      const state = item.status === "已发布" ? "done" : item.status === "待发布" ? "warn" : "";
      return (
        '<div class="slot-mini">' +
          '<span class="slot-time">' + (slot.time || "").split("-")[0] + "</span>" +
          '<span class="slot-dot ' + state + '"></span>' +
          '<div class="slot-info"><b>' + (item.text || "还空着，去排一条") + "</b><span>" +
            (t ? t.name : "待定") + " · " + (slot.level || "常规") + "档</span></div>" +
          '<span class="slot-status ' + (item.status === "已发布" ? "done" : "") + '">' + item.status + "</span>" +
        "</div>"

    const draftRows = store.drafts.slice(0, 2).map((d) => {
      const t = Core.typeById(d.type);
      return (
        '<div class="hist-item" style="box-shadow:none;padding:11px 0;border-bottom:1px solid var(--line);border-radius:0;margin:0" onclick="App.openDraft(\'' + d.id + '\')">' +

          '<button class="icon-btn round" onclick="App.go(\'sync\')" style="position:relative">' + icon("cloud", 19) +
            (pendingSync ? '<i style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#FA5151"></i>' : "") +

        ) +

        '<div class="hero">' +
          '<div class="hero-top">' +
            "<div><div class=\"hero-greet\">" + greeting() + "，</div><div class=\"hero-title\">" +
              Core.escapeHtml(store.user.name || "朋友") + "</div></div>" +
            (store.user.avatar
              ? '<div class="hero-avatar" style="padding:0;overflow:hidden"><img src="' + Core.escapeHtml(store.user.avatar) + '" alt="头像" /></div>'
              : '<div class="hero-avatar">' + Core.escapeHtml([...(store.user.name || "我")][0] || "我") + "</div>") +
          "</div>" +
          '<div class="hero-stats">' +
            '<div class="hero-stat"><b>' + sentCount + '</b><span>今日已发</span></div>' +
            '<div class="hero-stat"><b>' + todoCount + '</b><span>待发 / 待排</span></div>' +
            '<div class="hero-stat"><b>' + blocked + '</b><span>累计拦截</span></div>' +
          "</div>" +
          '<button class="hero-cta" onclick="App.tab(\'create\')">' + icon("spark", 17) + " 写一条今天的朋友圈</button>" +
        "</div>" +

        '<div class="quick-grid">' +
          quick("create", "tool", "#EAFBF1", "#07C160", "写文案", "App.tab('create')") +
          quick("compliance", "shield", "#FFF1F0", "#FA5151", "合规检测", "App.go('compliance')") +
          quick("topics", "bulb", "#FFF5E9", "#FF9F43", "找选题", "App.tab('topics')") +
          quick("schedule", "clock", "#EEF3FF", "#5B8FF9", "今日排期", "App.go('schedule')") +

        '<div class="stat-row">' +
          '<div class="stat"><b>' + store.drafts.length + '<em>条</em></b><span>草稿待发</span></div>' +
          '<div class="stat"><b>' + store.history.length + '<em>条</em></b><span>本周产出</span></div>' +
          '<div class="stat"><b>' + (store.materials.copy.length + store.materials.images.length + store.materials.videos.length) + '<em>个</em></b><span>素材沉淀</span></div>' +
        "</div>" +

        '<div class="section-title"><h2>今日发布节奏</h2><span onclick="App.go(\'schedule\')" style="color:var(--green-dark)">全部排期</span></div>' +

          ratio("干货价值", 40, "#07C160") +
          ratio("生活人设", 30, "#5B8FF9") +
          ratio("互动引导", 20, "#FF9F43") +
          ratio("促销转化", 10, "#FF6B81") +
          '<div class="hint">' + icon("bulb", 14) + '<span>让用户有收获，是别人不屏蔽你的唯一理由。</span></div>' +
        "</div>" +

        '<div class="section-title"><h2>最近草稿</h2><span onclick="App.go(\'history\')" style="color:var(--green-dark)">历史记录</span></div>' +
        '<div class="card" style="padding:6px 14px">' + (draftRows || UI.empty("还没有草稿，去创作一条吧")) + "</div>" +
      "</div>"
    );
  }

  function quick(page, ic, bg, color, label, action) {
    return (
      '<button class="quick" onclick="' + action + '" style="border:none;font-family:inherit">' +
        '<div class="q-icon" style="background:' + bg + ';color:' + color + '">' + icon(ic, 18) + "</div>" +
        "<span>" + label + "</span>" +
      "</button>"
    );
  }

  function ratio(label, n, color) {
    return (
      '<div class="ratio-item">' +
        '<span class="ratio-label">' + label + "</span>" +
        '<div class="ratio-bar"><i style="width:' + n + "%;background:" + color + '"></i></div>' +
        '<span class="ratio-num">' + n + "%</span>" +
      "</div>"
    );
  }

  function renderCreate() {
    const cards = store.types.map((t) =>
      '<div class="type-card" onclick="App.pickType(\'' + t.id + '\')">' +
        '<div class="type-icon" style="background:' + t.bg + ";color:" + t.color + '">' + icon(t.icon, 19) + "</div>" +
        '<span class="type-arrow">' + icon("right", 15) + "</span>" +
        "<h3>" + t.name + "</h3>" +
        "<p>" + t.structure + "</p>" +
      "</div>"
    ).join("");

    return (
      '<div class="page">' +
        UI.head("文案创作", "先合规，再复制发布") +
        '<div class="notice">' + icon("shield", 15) +
          "<span>所有 AI 生成、自由创作、上传的内容，都会自动做一次严格合规检测。未通过前不可复制、保存或发布。</span>" +
        "</div>" +
        '<div class="section-title"><h2>选择文案类型</h2><span>8 种结构</span></div>' +
        '<div class="type-grid">' + cards + "</div>" +
        '<div class="hint" style="margin-top:16px">' + icon("bulb", 14) +
          "<span>每种类型都有固定的写作结构和细分方向，先选结构，再让 AI 按你的人设填内容。</span>" +
        "</div>" +
      "</div>"

  }

  window.ViewsHome = { renderHome, renderCreate };
})();

<script>
/* 页面：创作工作区（AI 生成 / 自由创作 + 合规拦截 + 朋友圈预览） */
(function () {
  const { store, ui } = Core;
  const icon = UI.icon;

  const AI_STYLES = [
    { id: "deai", label: "去 AI 味" },
    { id: "like", label: "更像我本人" },
    { id: "real", label: "有真人感" },
    { id: "softsell", label: "营销感弱一点" },
    { id: "emotion", label: "更有情感故事感" },
    { id: "casual", label: "专业弱一点、口语化" }
  ];
  const FREE_STYLES = [
    { id: "softsell", label: "营销感弱一点" },
    { id: "emotion", label: "更有情感故事感" },
    { id: "casual", label: "专业化弱一点、口语化" }
  ];

  function renderCompose() {
    const c = ui.compose;
    if (!c) return "";
    const t = Core.typeById(c.typeId) || store.types[0];
    const isAI = c.mode === "ai";
    const styles = isAI ? AI_STYLES : FREE_STYLES;
    const size = c.size || "short";

    // 文风选项缩小显示
    const styleChips = styles.map((s) =>
      '<button class="chip small ' + (c.styles.indexOf(s.id) >= 0 ? "active" : "") + '" onclick="App.toggleStyle(\'' + s.id + '\')">' + s.label + "</button>"
    ).join("");

    return (
      '<div class="page compose-page">' +
        UI.head(t.name, t.structure, '<span class="tag ' + (c.check && !c.check.passed ? "red" : "green") + '">' +
          (c.check ? (c.check.passed ? "合规通过" : "已拦截") : "待检测") + "</span>", true) +

        // 文案结构 + 写作提示
        '<div class="tip-card">' +
          '<div class="tip-row"><span class="tip-label">结构</span><span class="tip-val">' + t.structure + "</span></div>" +
          '<div class="tip-row"><span class="tip-label">提示</span><span class="tip-val"><b>' + t.instruction + "</b></span></div>" +
          '<div class="tip-row"><span class="tip-label">方向</span><span class="tip-val">' + t.direction + "</span></div>" +
        "</div>" +

        '<div class="seg">' +
          '<button class="' + (isAI ? "active" : "") + '" onclick="App.setMode(\'ai\')">AI 生成</button>' +
          '<button class="' + (!isAI ? "active" : "") + '" onclick="App.setMode(\'free\')">自由创作</button>' +
        "</div>" +

        '<div class="seg mini size-seg">' +
          '<button class="' + (size === "short" ? "active" : "") + '" onclick="App.setSize(\'short\')">短文</button>' +
          '<button class="' + (size === "long" ? "active" : "") + '" onclick="App.setSize(\'long\')">长文</button>' +
        "</div>" +
        '<div class="size-hint">' + (size === "short"
          ? "短文 ≈ 3 行 / " + Core.SHORT_MAX + " 字内，适合快速刷屏，不易被折叠"
          : "长文 4-8 段，适合讲故事、做案例，注意前两行放钩子") + "</div>" +

        (isAI ? aiForm(c, styleChips) : freeForm(c, styleChips)) +
        resultBlock(c, t) +
      "</div>"
    );
  }

  function aiForm(c, styleChips) {
    return (
      // AI 生成：大输入框
      '<div class="field">' +
        '<textarea class="textarea" id="composeInput" rows="6" placeholder="写下这次的选题 / 想写的事，例如：我普通的一天" oninput="App.setTopic(this.value)">' + Core.escapeHtml(c.topic) + "</textarea>" +
      "</div>" +

      // 文风调节（缩小，放在输入框下方）
      '<div class="chips">' + styleChips + "</div>" +

      '<button class="btn primary block" onclick="App.generate()">' +
        icon("spark", 17) + (c.result ? "重新生成" : "生成文案") + "</button>" +
      '<div class="hint">' + icon("shield", 13) + "<span>生成后自动检测，命中违规会立即拦截，并给出可替换版本。</span></div>"
    );
  }

  function freeForm(c, styleChips) {
    const len = [...c.text].length;
    const short = (c.size || "short") === "short";
    const judge = short
      ? (len > Core.SHORT_MAX ? "偏长，建议切「长文」" : "长度合适")
      : (len < 200 ? "偏短，长文建议 300 字以上" : "长度合适");
    return (
      // 自由创作：大输入框
      '<div class="field">' +
        '<textarea class="textarea" id="composeInput" rows="7" placeholder="' + (short ? "想到什么就写什么，一两句也行…" : "想到什么就写什么，长文可以分几段…") + '" oninput="App.setDraftText(this.value)">' + Core.escapeHtml(c.text) + "</textarea>" +
        '<div style="display:flex;justify-content:space-between;margin-top:6px">' +
          '<span class="muted" id="charCount">' + len + " 字 · " + (short ? "目标 ≤ " + Core.SHORT_MAX : "目标 300+") + "</span>" +
          '<span class="muted">' + judge + "</span>" +
        "</div>" +
      "</div>" +

      // 文风调节（缩小，放在输入框下方）
      '<div class="chips">' + styleChips + "</div>" +

      '<button class="btn primary block" onclick="App.polish()">' + icon("spark", 17) + "AI 润色并检测</button>" +
      '<div class="hint">' + icon("shield", 13) + "<span>润色不会改变你的原意，只调整语气、结构和营销感。</span></div>"
    );
  }

  function resultBlock(c, t) {
    if (c.loading) {
      return '<div class="card result"><div class="gen-loading"><i></i><i></i><i></i><i></i></div><div class="muted" style="text-align:center">正在按「' + t.name + '」结构生成…</div></div>';
    }
    if (!c.result) return "";

    const check = c.check || Core.checkText(c.result);
    const fold = Core.foldInfo(c.result);
    const highlightHtml = Core.highlight(c.result, check.violations);
    const violationsHtml = check.violations.slice(0, 5).map((v) =>
      '<div class="vio">' +
        '<div class="vio-head"><span class="tag red">' + v.category + "</span><span class=\"vio-word\">" + Core.escapeHtml(v.word) + "</span></div>" +
        '<div class="vio-reason">' + v.reason + "</div>" +
        '<div class="vio-fix">建议替换为「' + Core.escapeHtml(v.suggestion) + "」</div>" +
      "</div>"
    ).join("");

    return (
      '<div class="card result">' +
        '<div class="result-head"><h3>生成结果</h3>' +
          '<span class="tag ' + (check.passed ? "green" : "red") + '">' + (check.passed ? "合规可发布" : "强制拦截") + "</span>" +
        "</div>" +
        '<div class="meta">' +
          '<span class="tag gray" style="margin-right:2px">' + (c.size === "long" ? "长文" : "短文") + "</span>" +
          "<span>" + fold.chars + " 字</span>" +
          "<span>预计 " + fold.lines + " 行</span>" +
          '<span class="' + (fold.folded ? "warn" : "ok") + '">折叠风险 ' + fold.risk + "</span>" +
        "</div>" +
        '<div class="copy-text">' + highlightHtml + "</div>" +

        '<div class="compliance ' + (check.passed ? "pass" : "fail") + '">' +
          '<div class="comp-head">' + icon(check.passed ? "shield" : "alert", 16) +
            (check.passed ? "合规检测通过" : "检测到 " + check.count + " 处违规，已拦截") +
          "</div>" +
          '<div class="comp-desc">' + (check.passed
            ? "未命中违禁词 / 敏感词 / 极限词 / 营销违规，可以复制发布。"
            : "未替换为安全版本前，不可复制、保存或发布。") + "</div>" +
          violationsHtml +
        "</div>" +

        (c.replaced
          ? '<div class="muted" style="margin-top:12px;margin-bottom:5px">已替换为安全合规版本</div><div class="replaced">' + Core.escapeHtml(c.fixedText) + "</div>"
          : "") +

        '<div class="hint" style="margin-top:12px">' + icon("clock", 13) + "<span>防折叠：" + fold.advice + "</span></div>" +
        moment(c.result, check) +
        actions(c, check) +
      "</div>"
    );
  }

  function moment(text, check) {
    const fold = Core.foldInfo(text);
    const u = store.user || {};
    const name = u.name || "我";
    const avatar = u.avatar
      ? '<div class="moment-avatar" style="padding:0;overflow:hidden"><img src="' + Core.escapeHtml(u.avatar) + '" alt="头像" /></div>'
      : '<div class="moment-avatar">' + Core.escapeHtml([...name][0] || "我") + "</div>";
    return (
      '<div class="moment-preview">' +
        '<div class="moment-head">' + avatar +
          "<div><div class=\"moment-name\">" + Core.escapeHtml(name) + "</div>" +
          '<div style="font-size:11px;color:#B2B6BC;margin-top:2px">刚刚 · 朋友圈预览</div></div>' +
        "</div>" +
        '<div class="moment-text' + (fold.folded ? " moment-fold" : "") + '">' + Core.escapeHtml(text) + "</div>" +
        (fold.folded ? '<div class="moment-more">全文</div>' : "") +
        '<div class="moment-foot"><span>' + (fold.lines > 6 ? "会被折叠为「全文」" : "完整展示，不会被折叠") + "</span>" +
          '<div class="fold-meter"><i class="on"></i><i class="' + (fold.lines > 2 ? "on" : "") + '"></i><i class="' + (fold.lines > 4 ? (fold.folded ? "warn" : "on") : "") + '"></i></div>' +
        "</div>" +
      "</div>"
    );
  }

  function actions(c, check) {
    if (!check.passed && !c.replaced) {
      return '<div class="btn-row" style="margin-top:14px">' +
        '<button class="btn danger" onclick="App.applyFix()">一键替换</button>' +
        '<button class="btn ghost" onclick="App.generate()">重新生成</button>' +
      "</div>";
    }
    return '<div class="btn-row" style="margin-top:14px">' +
        '<button class="btn primary" onclick="App.copy()">' + icon("copy", 16) + "复制全文</button>" +
        '<button class="btn ghost" onclick="App.saveDraft()">' + icon("save", 16) + "保存并归档</button>" +
      "</div>" +
      '<div class="btn-row" style="margin-top:8px">' +
        '<button class="btn soft small" onclick="App.toMaterials()">存入素材库</button>' +
        '<button class="btn soft small" onclick="App.addToSchedule()">加入今日排期</button>' +
      "</div>";
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        return true;
      } catch (err) {
        return false;
      }
    }
  }

  window.ViewsCompose = { renderCompose, copyText };
})();

</script>
<script>

    );
  }

  window.ViewsLibrary = { renderTopics, renderMaterials, copyTypeNames, copyLib };
})();

<script>
/* 页面：排期 / 资料库 / 历史 / 合规检测 / 云盘同步 / 我的 */
(function () {
  const { store, ui } = Core;
  const icon = UI.icon;

  /* ---------- 发布时间排期（今日选题 ↔ 时间段） ---------- */
  function renderSchedule() {
    const n = Core.now();
    const hm = n.getHours() * 60 + n.getMinutes();
    const schedule = store.schedule || [];
    const topicList = Core.todayTopicList();
    const planned = topicList.filter((t) => schedule.some((x) => x.topicId === t.id)).length;

    // 今日选题：每条后面可直接安排 / 调整时间段
    const topicRows = topicList.map((t, i) => {
      const item = schedule.find((x) => x.topicId === t.id);
      const slot = item ? store.slots.find((s) => s.id === item.slotId) : null;
      const type = Core.typeById(t.type);
      return (
        '<div class="topic-plan">' +
          '<div class="topic-index">' + (i + 1 < 10 ? "0" : "") + (i + 1) + "</div>" +
          '<div class="topic-plan-body">' +
            "<b>" + Core.escapeHtml(t.title) + "</b>" +
            '<div class="topic-meta">' +
              (type ? '<span class="tag gray">' + type.name + "</span>" : "") +
              (slot ? '<span class="tag green">' + slot.time + "</span>" : '<span class="tag gray">未安排</span>') +
            "</div>" +
          "</div>" +
          '<button class="btn soft small" onclick="App.openSlotPicker(\'' + t.id + '\')">' +
            (slot ? "改时段" : "安排") + "</button>" +
        "</div>"
      );
    }).join("");

    const cards = store.slots.map((s) => {
      const start = s.time.split("-")[0].split(":");
      const live = hm >= parseInt(start[0]) * 60 + parseInt(start[1]);
      const item = schedule.find((x) => x.slotId === s.id) || {};
      const tp = item.topicId ? Core.topicById(item.topicId) : null;
      const t = item.type ? Core.typeById(item.type) : null;
      const has = !!(tp || item.text);
      const hasContent = !!(item.content && item.content.trim());
      const levelTag = s.level === "黄金" ? "green" : s.level === "小黄金" ? "orange" : s.level === "睡前" ? "blue" : "gray";

      const contentPreview = hasContent
        ? '<div class="slot-content">' + Core.escapeHtml(item.content.slice(0, 80)) + (item.content.length > 80 ? "…" : "") + "</div>"
        : "";
      return (
        '<div class="slot-card ' + cls + '">' +
          '<div class="slot-top"><span class="slot-t">' + s.time + "</span>" +
            '<span class="tag ' + levelTag + '">' + s.level + "档" + (live && !has ? " · 已过" : "") + "</span>" +
            (s.custom ? '<span class="tag purple">自定义</span>' : "") +
          "</div>" +
          '<div class="slot-desc">' + s.scene + " · " + s.title + "</div>" +
          '<div class="slot-types">' + s.types.map((x) => '<span class="tag gray">' + x + "</span>").join("") + "</div>" +
          (has

                '<div class="slot-plan-main">' +
                  (tp ? '<span class="tag blue">选题</span>' : '<span class="tag orange">文案</span>') +
                  "<b>" + Core.escapeHtml(tp ? tp.title : item.text) + "</b>" +
                "</div>" +
                '<div class="slot-note">' + (item.status || "待排") + (t ? " · " + t.name : "") + "</div>" +
                contentPreview +
                '<div class="slot-content-act">' +
                  (hasContent
                    ? '<button class="btn ghost small" onclick="App.editSlotContent(\'' + s.id + '\')">编辑内容</button>'
                    : '<button class="btn soft small" onclick="App.genSlotContent(\'' + s.id + '\')">生成内容</button>') +
                  '<button class="btn ghost small" onclick="App.editSlotContent(\'' + s.id + '\')">自由创作</button>' +
                "</div>" +
              "</div>"
            : '<div class="slot-note">暂未安排 · 可点下方生成内容或去创作</div>') +
          '<div class="slot-act">' +
            (item.status === "待发布"
              ? '<button class="btn soft small" onclick="App.publishSlot(\'' + s.id + '\')">标记已发布</button>'
              : '<button class="btn ghost small" onclick="App.fillSlot(\'' + s.id + '\')">去创作</button>') +
            (has ? '<button class="btn ghost small" onclick="App.clearSlot(\'' + s.id + '\')">移出</button>' : "") +
            '<button class="btn ghost small" onclick="App.openSlotSheet(\'' + s.id + '\')">改时段</button>' +
            '<button class="btn ghost small" style="color:#FA5151" onclick="App.delSlot(\'' + s.id + '\')">删</button>' +
          "</div>" +
        "</div>"
      );
    }).join("");
