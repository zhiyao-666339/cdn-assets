<script>
/* views-home.js */
/* 页面：工作台 + 文案创作入口 */
(function () {
  const { store, ui } = Core;
  const icon = UI.icon;

  function greeting() {
    const h = Core.now().getHours();
    if (h < 6) return "凌晨好";
    if (h < 11) return "早上好";
    if (h < 14) return "中午好";
    if (h < 18) return "下午好";
    return "晚上好";
  }

  function dateLine() {
    const d = Core.now();
    const week = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][d.getDay()];
    return (d.getMonth() + 1) + " 月 " + d.getDate() + " 日 · " + week;
  }

  function renderHome() {
    const pendingSync = (ui.sync.pending || []).length;
    const slots = store.slots;
    const today = store.schedule || [];
    const sentCount = today.filter((x) => x.status === "已发布").length;
    const todoCount = today.filter((x) => x.status !== "已发布").length;
    const blocked = store.blocks.length;

    const slotRows = today.slice(0, 3).map((item) => {
      const slot = slots.find((s) => s.id === item.slotId) || {};
      const t = Core.typeById(item.type);
      const state = item.status === "已发布" ? "done" : item.status === "待发布" ? "warn" : "";
      return (
        '<div class="slot-mini">' +
          '<span class="slot-time">' + (slot.time || "").split("-")[0] + "</span>" +
          '<span class="slot-dot ' + state + '"></span>' +
          '<div class="slot-info"><b>' + (item.text || "还空着，去排一条") + "</b><span>" +
            (t ? t.name : "待定") + " · " + (slot.level || "常规") + "档</span></div>" +
          '<span class="slot-status ' + (item.status === "已发布" ? "done" : "") + '">' + item.status + "</span>" +
        "</div>"
      );
    }).join("");

    const draftRows = store.drafts.slice(0, 2).map((d) => {
      const t = Core.typeById(d.type);
      return (
        '<div class="hist-item" style="box-shadow:none;padding:11px 0;border-bottom:1px solid var(--line);border-radius:0;margin:0" onclick="App.openDraft(\'' + d.id + '\')">' +
          '<div class="hist-top">' +
            '<span class="tag ' + (d.passed ? "green" : "red") + '">' + (d.passed ? "已合规" : "被拦截") + "</span>" +
            '<span class="tag gray">' + (t ? t.name : "") + "</span>" +
            '<span class="time">' + Core.timeAgo(d.time) + "</span>" +
          "</div>" +
          '<div class="hist-text">' + Core.escapeHtml(d.text) + "</div>" +
        "</div>"
      );
    }).join("");

    return (
      '<div class="page">' +
        UI.head(
          "朋友圈 AI 助手",
          dateLine(),
          '<button class="icon-btn round" onclick="App.go(\'sync\')" style="position:relative">' + icon("cloud", 19) +
            (pendingSync ? '<i style="position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:#FA5151"></i>' : "") +
          "</button>"
        ) +

        '<div class="hero">' +
          '<div class="hero-top">' +
            "<div><div class=\"hero-greet\">" + greeting() + "，</div><div class=\"hero-title\">" +
              Core.escapeHtml(store.user.name || "朋友") + "</div></div>" +
            (store.user.avatar
              ? '<div class="hero-avatar" style="padding:0;overflow:hidden"><img src="' + Core.escapeHtml(store.user.avatar) + '" alt="头像" /></div>'
              : '<div class="hero-avatar">' + Core.escapeHtml([...(store.user.name || "我")][0] || "我") + "</div>") +
          "</div>" +
          '<div class="hero-stats">' +
            '<div class="hero-stat"><b>' + sentCount + '</b><span>今日已发</span></div>' +
            '<div class="hero-stat"><b>' + todoCount + '</b><span>待发 / 待排</span></div>' +
            '<div class="hero-stat"><b>' + blocked + '</b><span>累计拦截</span></div>' +
          "</div>" +
          '<button class="hero-cta" onclick="App.tab(\'create\')">' + icon("spark", 17) + " 写一条今天的朋友圈</button>" +
        "</div>" +

        '<div class="quick-grid">' +
          quick("create", "tool", "#EAFBF1", "#07C160", "写文案", "App.tab('create')") +
          quick("compliance", "shield", "#FFF1F0", "#FA5151", "合规检测", "App.go('compliance')") +
          quick("topics", "bulb", "#FFF5E9", "#FF9F43", "找选题", "App.tab('topics')") +
          quick("schedule", "clock", "#EEF3FF", "#5B8FF9", "今日排期", "App.go('schedule')") +
        "</div>" +

        '<div class="stat-row">' +
          '<div class="stat"><b>' + store.drafts.length + '<em>条</em></b><span>草稿待发</span></div>' +
          '<div class="stat"><b>' + store.history.length + '<em>条</em></b><span>本周产出</span></div>' +
          '<div class="stat"><b>' + (store.materials.copy.length + store.materials.images.length + store.materials.videos.length) + '<em>个</em></b><span>素材沉淀</span></div>' +
        "</div>" +

        '<div class="section-title"><h2>今日发布节奏</h2><span onclick="App.go(\'schedule\')" style="color:var(--green-dark)">全部排期</span></div>' +
        '<div class="card" style="padding:4px 14px">' + (slotRows || UI.empty("今天还没有排期")) + "</div>" +

        '<div class="section-title"><h2>内容黄金比例</h2><span>4 : 3 : 2 : 1</span></div>' +
        '<div class="card">' +
          ratio("干货价值", 40, "#07C160") +
          ratio("生活人设", 30, "#5B8FF9") +
          ratio("互动引导", 20, "#FF9F43") +
          ratio("促销转化", 10, "#FF6B81") +
          '<div class="hint">' + icon("bulb", 14) + '<span>让用户有收获，是别人不屏蔽你的唯一理由。</span></div>' +
        "</div>" +

        '<div class="section-title"><h2>最近草稿</h2><span onclick="App.go(\'history\')" style="color:var(--green-dark)">历史记录</span></div>' +
        '<div class="card" style="padding:6px 14px">' + (draftRows || UI.empty("还没有草稿，去创作一条吧")) + "</div>" +
      "</div>"
    );
  }

  function quick(page, ic, bg, color, label, action) {
    return (
      '<button class="quick" onclick="' + action + '" style="border:none;font-family:inherit">' +
        '<div class="q-icon" style="background:' + bg + ';color:' + color + '">' + icon(ic, 18) + "</div>" +
        "<span>" + label + "</span>" +
      "</button>"
    );
  }

  function ratio(label, n, color) {
    return (
      '<div class="ratio-item">' +
        '<span class="ratio-label">' + label + "</span>" +
        '<div class="ratio-bar"><i style="width:' + n + "%;background:" + color + '"></i></div>' +
        '<span class="ratio-num">' + n + "%</span>" +
      "</div>"
    );
  }

  function renderCreate() {
    const cards = store.types.map((t) =>
      '<div class="type-card" onclick="App.pickType(\'' + t.id + '\')">' +
        '<div class="type-icon" style="background:' + t.bg + ";color:" + t.color + '">' + icon(t.icon, 19) + "</div>" +
        '<span class="type-arrow">' + icon("right", 15) + "</span>" +
        "<h3>" + t.name + "</h3>" +
        "<p>" + t.structure + "</p>" +
      "</div>"
    ).join("");

    return (
      '<div class="page">' +
        UI.head("文案创作", "先合规，再复制发布") +
        '<div class="notice">' + icon("shield", 15) +
          "<span>所有 AI 生成、自由创作、上传的内容，都会自动做一次严格合规检测。未通过前不可复制、保存或发布。</span>" +
        "</div>" +
        '<div class="section-title"><h2>选择文案类型</h2><span>8 种结构</span></div>' +
        '<div class="type-grid">' + cards + "</div>" +
        '<div class="hint" style="margin-top:16px">' + icon("bulb", 14) +
          "<span>每种类型都有固定的写作结构和细分方向，先选结构，再让 AI 按你的人设填内容。</span>" +
        "</div>" +
      "</div>"
    );
  }

  window.ViewsHome = { renderHome, renderCreate };
})();

</script>
<script>
/* views-compose.js */
/* 页面：创作工作区（AI 生成 / 自由创作 + 合规拦截 + 朋友圈预览） */
(function () {
  const { store, ui } = Core;
  const icon = UI.icon;

  const AI_STYLES = [
    { id: "deai", label: "去 AI 味" },
    { id: "like", label: "更像我本人" },
    { id: "real", label: "有真人感" },
    { id: "softsell", label: "营销感弱一点" },
    { id: "emotion", label: "更有情感故事感" },
    { id: "casual", label: "专业弱一点、口语化" }
  ];
  const FREE_STYLES = [
    { id: "softsell", label: "营销感弱一点" },
    { id: "emotion", label: "更有情感故事感" },
    { id: "casual", label: "专业化弱一点、口语化" }
  ];

  function renderCompose() {
    const c = ui.compose;
    if (!c) return "";
    const t = Core.typeById(c.typeId) || store.types[0];
    const isAI = c.mode === "ai";
    const styles = isAI ? AI_STYLES : FREE_STYLES;
    const size = c.size || "short";

    // 文风选项缩小显示
    const styleChips = styles.map((s) =>
      '<button class="chip small ' + (c.styles.indexOf(s.id) >= 0 ? "active" : "") + '" onclick="App.toggleStyle(\'' + s.id + '\')">' + s.label + "</button>"
    ).join("");

    return (
      '<div class="page compose-page">' +
        UI.head(t.name, t.structure, '<span class="tag ' + (c.check && !c.check.passed ? "red" : "green") + '">' +
          (c.check ? (c.check.passed ? "合规通过" : "已拦截") : "待检测") + "</span>", true) +

        // 文案结构 + 写作提示
        '<div class="tip-card">' +
          '<div class="tip-row"><span class="tip-label">结构</span><span class="tip-val">' + t.structure + "</span></div>" +
          '<div class="tip-row"><span class="tip-label">提示</span><span class="tip-val"><b>' + t.instruction + "</b></span></div>" +
          '<div class="tip-row"><span class="tip-label">方向</span><span class="tip-val">' + t.direction + "</span></div>" +
        "</div>" +

        '<div class="seg">' +
          '<button class="' + (isAI ? "active" : "") + '" onclick="App.setMode(\'ai\')">AI 生成</button>' +
          '<button class="' + (!isAI ? "active" : "") + '" onclick="App.setMode(\'free\')">自由创作</button>' +
        "</div>" +

        '<div class="seg mini size-seg">' +
          '<button class="' + (size === "short" ? "active" : "") + '" onclick="App.setSize(\'short\')">短文</button>' +
          '<button class="' + (size === "long" ? "active" : "") + '" onclick="App.setSize(\'long\')">长文</button>' +
        "</div>" +
        '<div class="size-hint">' + (size === "short"
          ? "短文 ≈ 3 行 / " + Core.SHORT_MAX + " 字内，适合快速刷屏，不易被折叠"
          : "长文 4-8 段，适合讲故事、做案例，注意前两行放钩子") + "</div>" +

        (isAI ? aiForm(c, styleChips) : freeForm(c, styleChips)) +
        resultBlock(c, t) +
      "</div>"
    );
  }

  function aiForm(c, styleChips) {
    return (
      // AI 生成：大输入框
      '<div class="field">' +
        '<textarea class="textarea" id="composeInput" rows="6" placeholder="写下这次的选题 / 想写的事，例如：我普通的一天" oninput="App.setTopic(this.value)">' + Core.escapeHtml(c.topic) + "</textarea>" +
      "</div>" +

      // 文风调节（缩小，放在输入框下方）
      '<div class="chips">' + styleChips + "</div>" +

      '<button class="btn primary block" onclick="App.generate()">' +
        icon("spark", 17) + (c.result ? "重新生成" : "生成文案") + "</button>" +
      '<div class="hint">' + icon("shield", 13) + "<span>生成后自动检测，命中违规会立即拦截，并给出可替换版本。</span></div>"
    );
  }

  function freeForm(c, styleChips) {
    const len = [...c.text].length;
    const short = (c.size || "short") === "short";
    const judge = short
      ? (len > Core.SHORT_MAX ? "偏长，建议切「长文」" : "长度合适")
      : (len < 200 ? "偏短，长文建议 300 字以上" : "长度合适");
    return (
      // 自由创作：大输入框
      '<div class="field">' +
        '<textarea class="textarea" id="composeInput" rows="7" placeholder="' + (short ? "想到什么就写什么，一两句也行…" : "想到什么就写什么，长文可以分几段…") + '" oninput="App.setDraftText(this.value)">' + Core.escapeHtml(c.text) + "</textarea>" +
        '<div style="display:flex;justify-content:space-between;margin-top:6px">' +
          '<span class="muted" id="charCount">' + len + " 字 · " + (short ? "目标 ≤ " + Core.SHORT_MAX : "目标 300+") + "</span>" +
          '<span class="muted">' + judge + "</span>" +
        "</div>" +
      "</div>" +

      // 文风调节（缩小，放在输入框下方）
      '<div class="chips">' + styleChips + "</div>" +

      '<button class="btn primary block" onclick="App.polish()">' + icon("spark", 17) + "AI 润色并检测</button>" +
      '<div class="hint">' + icon("shield", 13) + "<span>润色不会改变你的原意，只调整语气、结构和营销感。</span></div>"
    );
  }

  function resultBlock(c, t) {
    if (c.loading) {
      return '<div class="card result"><div class="gen-loading"><i></i><i></i><i></i><i></i></div><div class="muted" style="text-align:center">正在按「' + t.name + '」结构生成…</div></div>';
    }
    if (!c.result) return "";

    const check = c.check || Core.checkText(c.result);
    const fold = Core.foldInfo(c.result);
    const highlightHtml = Core.highlight(c.result, check.violations);
    const violationsHtml = check.violations.slice(0, 5).map((v) =>
      '<div class="vio">' +
        '<div class="vio-head"><span class="tag red">' + v.category + "</span><span class=\"vio-word\">" + Core.escapeHtml(v.word) + "</span></div>" +
        '<div class="vio-reason">' + v.reason + "</div>" +
        '<div class="vio-fix">建议替换为「' + Core.escapeHtml(v.suggestion) + "」</div>" +
      "</div>"
    ).join("");

    return (
      '<div class="card result">' +
        '<div class="result-head"><h3>生成结果</h3>' +
          '<span class="tag ' + (check.passed ? "green" : "red") + '">' + (check.passed ? "合规可发布" : "强制拦截") + "</span>" +
        "</div>" +
        '<div class="meta">' +
          '<span class="tag gray" style="margin-right:2px">' + (c.size === "long" ? "长文" : "短文") + "</span>" +
          "<span>" + fold.chars + " 字</span>" +
          "<span>预计 " + fold.lines + " 行</span>" +
          '<span class="' + (fold.folded ? "warn" : "ok") + '">折叠风险 ' + fold.risk + "</span>" +
        "</div>" +
        '<div class="copy-text">' + highlightHtml + "</div>" +

        '<div class="compliance ' + (check.passed ? "pass" : "fail") + '">' +
          '<div class="comp-head">' + icon(check.passed ? "shield" : "alert", 16) +
            (check.passed ? "合规检测通过" : "检测到 " + check.count + " 处违规，已拦截") +
          "</div>" +
          '<div class="comp-desc">' + (check.passed
            ? "未命中违禁词 / 敏感词 / 极限词 / 营销违规，可以复制发布。"
            : "未替换为安全版本前，不可复制、保存或发布。") + "</div>" +
          violationsHtml +
        "</div>" +

        (c.replaced
          ? '<div class="muted" style="margin-top:12px;margin-bottom:5px">已替换为安全合规版本</div><div class="replaced">' + Core.escapeHtml(c.fixedText) + "</div>"
          : "") +

        '<div class="hint" style="margin-top:12px">' + icon("clock", 13) + "<span>防折叠：" + fold.advice + "</span></div>" +
        moment(c.result, check) +
        actions(c, check) +
      "</div>"
    );
  }

  function moment(text, check) {
    const fold = Core.foldInfo(text);
    const u = store.user || {};
    const name = u.name || "我";
    const avatar = u.avatar
      ? '<div class="moment-avatar" style="padding:0;overflow:hidden"><img src="' + Core.escapeHtml(u.avatar) + '" alt="头像" /></div>'
      : '<div class="moment-avatar">' + Core.escapeHtml([...name][0] || "我") + "</div>";
    return (
      '<div class="moment-preview">' +
        '<div class="moment-head">' + avatar +
          "<div><div class=\"moment-name\">" + Core.escapeHtml(name) + "</div>" +
          '<div style="font-size:11px;color:#B2B6BC;margin-top:2px">刚刚 · 朋友圈预览</div></div>' +
        "</div>" +
        '<div class="moment-text' + (fold.folded ? " moment-fold" : "") + '">' + Core.escapeHtml(text) + "</div>" +
        (fold.folded ? '<div class="moment-more">全文</div>' : "") +
        '<div class="moment-foot"><span>' + (fold.lines > 6 ? "会被折叠为「全文」" : "完整展示，不会被折叠") + "</span>" +
          '<div class="fold-meter"><i class="on"></i><i class="' + (fold.lines > 2 ? "on" : "") + '"></i><i class="' + (fold.lines > 4 ? (fold.folded ? "warn" : "on") : "") + '"></i></div>' +
        "</div>" +
      "</div>"
    );
  }

  function actions(c, check) {
    if (!check.passed && !c.replaced) {
      return '<div class="btn-row" style="margin-top:14px">' +
        '<button class="btn danger" onclick="App.applyFix()">一键替换</button>' +
        '<button class="btn ghost" onclick="App.generate()">重新生成</button>' +
      "</div>";
    }
    return '<div class="btn-row" style="margin-top:14px">' +
        '<button class="btn primary" onclick="App.copy()">' + icon("copy", 16) + "复制全文</button>" +
        '<button class="btn ghost" onclick="App.saveDraft()">' + icon("save", 16) + "保存并归档</button>" +
      "</div>" +
      '<div class="btn-row" style="margin-top:8px">' +
        '<button class="btn soft small" onclick="App.toMaterials()">存入素材库</button>' +
        '<button class="btn soft small" onclick="App.addToSchedule()">加入今日排期</button>' +
      "</div>";
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch (e) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        return true;
      } catch (err) {
        return false;
      }
    }
  }

  window.ViewsCompose = { renderCompose, copyText };
})();

</script>
<script>
/* views-library.js */
/* 页面：选题库 + 素材库 */
(function () {
  const { store, ui } = Core;
  const icon = UI.icon;

  // 文案库按「文案类型」归档（与创作页的 8 种类型保持一致）
  function copyTypeNames() {
    return store.types.map((t) => t.name);
  }

  function renderTopics() {
    const list = Core.todayTopicList();
    const directions = ["全部"].concat([...new Set(list.map((t) => t.direction))]);
    const filter = ui.topicFilter || "全部";
    const shown = list.filter((t) => filter === "全部" || t.direction === filter);

    const chips = directions.map((d) =>
      '<button class="chip ' + (filter === d ? "active" : "") + '" onclick="App.setTopicFilter(\'' + d.replace(/'/g, "\\'") + '\')">' + d + "</button>"
    ).join("");

    const cards = shown.map((t, i) => {
      const type = Core.typeById(t.type);
      const item = (store.schedule || []).find((x) => x.topicId === t.id);
      const slot = item ? store.slots.find((s) => s.id === item.slotId) : null;
      return (
        '<div class="topic-card" onclick="App.topicToCompose(\'' + t.id + '\')">' +
          '<div class="topic-index">' + (i + 1 < 10 ? "0" : "") + (i + 1) + "</div>" +
          '<div class="topic-body">' +
            "<h3>" + Core.escapeHtml(t.title) + "</h3>" +
            '<div class="topic-meta">' +
              '<span class="tag blue">' + t.direction + "</span>" +
              (type ? '<span class="tag gray">' + type.name + "</span>" : "") +
              (slot ? '<span class="tag green">' + slot.time.split("-")[0] + "</span>" : "") +
            "</div>" +
          "</div>" +
          '<button class="btn ghost small" style="flex:0 0 auto;align-self:center" onclick="event.stopPropagation();App.openSlotPicker(\'' + t.id + '\')">' +
            (slot ? "改时段" : "排期") + "</button>" +
        "</div>"
      );
    }).join("");

    return (
      '<div class="page">' +
        UI.head("选题库", "每日 0 点自动更新，当天不重复", '<button class="icon-btn round" onclick="App.openTopicSheet()">' + icon("plus", 19) + "</button>") +
        '<div class="notice" style="margin-top:12px">' + icon("bulb", 15) +
          "<span>今日选题共 " + list.length + " 条，每天 0 点按手机日期自动轮换；当天互不重复，跨天尽量不复用近期用过的选题。</span></div>" +
        '<div class="filter-scroll">' + chips + "</div>" +
        (cards || UI.empty("今天还没有可用选题，点右上角添加", "bulb")) +
        '<div class="hint">' + icon("bulb", 14) + "<span>选题来自个人资料和四重视角，点任意一条即可带入创作，生成后仍会自动合规检测。</span></div>" +
      "</div>"
    );
  }

  function renderMaterials() {
    const tab = ui.materialsTab || "copy";
    const headBtn = '<button class="icon-btn round" onclick="App.openMaterialAdd()">' + icon("plus", 19) + "</button>";
    let body = "";
    if (tab === "copy") body = copyLib();
    if (tab === "image") body = imageLib();
    if (tab === "video") body = videoLib();

    return (
      '<div class="page">' +
        UI.head("素材库", "文案 · 图片 · 视频", headBtn) +
        '<div class="tabs">' +
          tabBtn("copy", "文案库 " + store.materials.copy.length, tab) +
          tabBtn("image", "图片库 " + store.materials.images.length, tab) +
          tabBtn("video", "视频库 " + store.materials.videos.length, tab) +
        "</div>" +
        body +
      "</div>"
    );
  }

  function tabBtn(id, label, active) {
    return '<button class="' + (active === id ? "active" : "") + '" onclick="App.setMaterialTab(\'' + id + '\')">' + label + "</button>";
  }

  function copyLib() {
    const cat = ui.materialCat || "全部";
    const cats = ["全部"].concat(copyTypeNames());
    const chips = cats.map((c) =>
      '<button class="chip small ' + (cat === c ? "active" : "") + '" onclick="App.setMaterialCat(\'' + c + '\')">' + c + "</button>"
    ).join("");
    const list = store.materials.copy.filter((m) => cat === "全部" || (m.type || m.category) === cat);
    const rows = list.map((m) => {
      const t = m.type || m.category;
      return (
        '<div class="material-item">' +
          '<div class="mf" style="margin-bottom:6px"><span class="tag blue">' + t + "</span>" +
            (m.legacyCategory ? '<span class="muted" style="margin-left:8px">原分类：' + Core.escapeHtml(m.legacyCategory) + "</span>" : "") +
          "</div>" +
          '<div class="mt">' + Core.escapeHtml(m.text) + "</div>" +
          '<div class="mf">' +
            "<span>" + Core.timeAgo(m.time) + "</span>" +
            '<div style="display:flex;gap:10px">' +
              '<button class="link-btn" onclick="App.copyMaterial(\'' + m.id + '\')">复制</button>' +
              '<button class="link-btn" onclick="App.materialToCompose(\'' + m.id + '\')">去创作</button>' +
            "</div>" +
          "</div>" +
        "</div>"
      );
    }).join("");
    return (
      '<div class="filter-scroll" style="padding-bottom:10px">' + chips + "</div>" +
      '<div class="btn-row" style="margin-bottom:12px">' +
        '<button class="btn ghost small" onclick="App.openMaterialAdd()">新增文案</button>' +
        '<button class="btn ghost small" onclick="App.openCopyUpload()">上传文案文件</button>' +
      "</div>" +
      (rows || UI.empty("这个类型还没有文案素材", "doc")) +
      '<div class="hint">' + icon("cloud", 14) + "<span>文案按「文案类型」归档，保存后自动同步到云盘「素材库/文案库/类型」目录。</span></div>"
    );
  }

  function imageLib() {
    const cards = store.materials.images.map((m) => {
      const isHeic = /^data:image\/hei[cf]/.test(m.src || "");
      const hasMedia = !!(m.src || m.url);
      return (
      '<div class="img-card"' + (hasMedia ? ' onclick="App.previewImage(\'' + m.id + '\')"' : "") + ">" +
        (isHeic
          ? '<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#f0f0f0;color:#999;font-size:11px">HEIC 图片<br>已存手机</div>'
          : (m.src
            ? '<img src="' + m.src + '" alt="' + Core.escapeHtml(m.prompt || "") + '" loading="lazy" />'
            : '<div class="img-miss">无预览</div>')) +
        '<span class="img-badge ' + (m.synced ? "ok" : "") + '">' + Core.escapeHtml(m.source || "图片") + "</span>" +
        '<div class="cap" style="display:flex;justify-content:space-between;align-items:end;gap:6px">' +
          "<span>" + Core.escapeHtml(m.prompt || m.source) + "</span>" +
          '<div style="display:flex;gap:8px;flex:0 0 auto">' +
            (hasMedia ? '<button class="link-btn" style="color:#fff;font-size:10.5px" onclick="event.stopPropagation();App.saveImageToPhone(\'' + m.id + '\')">保存</button>' : "") +
            (!m.synced && m.source === "图片上传" ? '<button class="link-btn" style="color:#fff;font-size:10.5px" onclick="event.stopPropagation();App.retryImage(\'' + m.id + '\')">重试</button>' : "") +
            '<button class="link-btn" style="color:#fff;font-size:10.5px" onclick="event.stopPropagation();App.removeImage(\'' + m.id + '\')">删除</button>' +
          "</div>" +
        "</div>" +
      "</div>"
      );
    }).join("");
    return (
      '<div class="img-grid">' +
        '<button class="img-add" onclick="App.openImageSheet()" style="font-family:inherit">' + icon("spark", 21) + "<span>AI 生成图片</span></button>" +
        '<label class="img-add">' + icon("cloud", 21) + "<span>上传图片</span>" +
          '<input class="file-cover" type="file" accept="image/*" multiple onchange="App.uploadImages(this)" />' +
        "</label>" +
        cards +
      "</div>" +
      '<div class="hint">' + icon("cloud", 14) + "<span>点任意图片可全屏预览并保存到手机相册；AI 生成的图片会自动保存到相册 / Pictures/朋友圈AI助手。</span></div>"
    );
  }

  function videoLib() {
    const cards = store.materials.videos.map((v) => {
      const playable = !!App.videoSrc(v.id);
      return (
        '<div class="video-card">' +
          '<div class="video-thumb' + (playable ? " play" : "") + '" onclick="App.previewVideo(\'' + v.id + '\')">' +
            icon("video", 22) + "</div>" +
          '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + Core.escapeHtml(v.title) + "</div>" +
            '<div class="muted">' + Core.escapeHtml(v.source || "") + " · " + Core.timeAgo(v.time) +
            (v.size ? " · " + (v.size >= 1024 ? (v.size / 1024).toFixed(1) + " MB" : v.size + " KB") : "") +
            "</div>" +
            (!playable
              ? '<div class="muted">未提供视频文件</div>'
              : v.local && !v.url
                ? '<div class="muted" style="color:#05803F">已保存到手机相册</div>'
                : '<div class="muted" style="color:#05803F">可播放</div>') +
            (v.error
              ? '<div class="muted" style="color:#C4281C">保存失败：' + Core.escapeHtml(v.error) + "</div>"
              : "") +
          "</div>" +
          '<div style="display:flex;flex-direction:column;gap:6px;flex:0 0 auto">' +
            (playable ? '<button class="link-btn" onclick="App.previewVideo(\'' + v.id + '\')">播放</button>' : "") +
            (/^https?:/i.test(v.url || "") ? '<button class="link-btn" onclick="App.saveVideoToPhone(\'' + v.id + '\')">保存</button>' : "") +
            (v.error ? '<button class="link-btn" onclick="App.retryVideo(\'' + v.id + '\')">重试</button>' : "") +
            '<button class="link-btn" onclick="App.removeVideo(\'' + v.id + '\')">删除</button>' +
          "</div>" +
        "</div>"
      );
    }).join("");
    return (
      (cards || UI.empty("还没有视频素材<br>选本地视频或填写视频链接即可播放", "video")) +
      '<div class="btn-row" style="margin-top:12px">' +
        '<button class="btn ghost small" onclick="App.openVideoSheet()">新增视频素材</button>' +
        '<label class="btn ghost small file-label">上传视频' +
          '<input class="file-cover" type="file" accept="video/*" multiple onchange="App.uploadVideos(this)" />' +
        "</label>" +
      "</div>" +
      '<div class="hint">' + icon("cloud", 14) + "<span>本地视频会自动保存到手机相册（Movies/朋友圈AI助手），本机播放只保留在当前打开期间；视频链接可直接在线播放。</span></div>"
    );
  }

  window.ViewsLibrary = { renderTopics, renderMaterials, copyTypeNames, copyLib };
})();

</script>
<script>
/* views-more.js */
/* 页面：排期 / 资料库 / 历史 / 合规检测 / 云盘同步 / 我的 */
(function () {
  const { store, ui } = Core;
  const icon = UI.icon;

  /* ---------- 发布时间排期（今日选题 ↔ 时间段） ---------- */
  function renderSchedule() {
    const n = Core.now();
    const hm = n.getHours() * 60 + n.getMinutes();
    const schedule = store.schedule || [];
    const topicList = Core.todayTopicList();
    const planned = topicList.filter((t) => schedule.some((x) => x.topicId === t.id)).length;

    // 今日选题：每条后面可直接安排 / 调整时间段
    const topicRows = topicList.map((t, i) => {
      const item = schedule.find((x) => x.topicId === t.id);
      const slot = item ? store.slots.find((s) => s.id === item.slotId) : null;
      const type = Core.typeById(t.type);
      return (
        '<div class="topic-plan">' +
          '<div class="topic-index">' + (i + 1 < 10 ? "0" : "") + (i + 1) + "</div>" +
          '<div class="topic-plan-body">' +
            "<b>" + Core.escapeHtml(t.title) + "</b>" +
            '<div class="topic-meta">' +
              (type ? '<span class="tag gray">' + type.name + "</span>" : "") +
              (slot ? '<span class="tag green">' + slot.time + "</span>" : '<span class="tag gray">未安排</span>') +
            "</div>" +
          "</div>" +
          '<button class="btn soft small" onclick="App.openSlotPicker(\'' + t.id + '\')">' +
            (slot ? "改时段" : "安排") + "</button>" +
        "</div>"
      );
    }).join("");

    const cards = store.slots.map((s) => {
      const start = s.time.split("-")[0].split(":");
      const live = hm >= parseInt(start[0]) * 60 + parseInt(start[1]);
      const item = schedule.find((x) => x.slotId === s.id) || {};
      const tp = item.topicId ? Core.topicById(item.topicId) : null;
      const t = item.type ? Core.typeById(item.type) : null;
      const has = !!(tp || item.text);
      const levelTag = s.level === "黄金" ? "green" : s.level === "小黄金" ? "orange" : s.level === "睡前" ? "blue" : "gray";
      const cls = s.level === "黄金" ? "gold" : s.level === "小黄金" ? "mini-gold" : s.level === "睡前" ? "bed" : "";
      return (
        '<div class="slot-card ' + cls + '">' +
          '<div class="slot-top"><span class="slot-t">' + s.time + "</span>" +
            '<span class="tag ' + levelTag + '">' + s.level + "档" + (live && !has ? " · 已过" : "") + "</span></div>" +
          '<div class="slot-desc">' + s.scene + " · " + s.title + "</div>" +
          '<div class="slot-types">' + s.types.map((x) => '<span class="tag gray">' + x + "</span>").join("") + "</div>" +
          (has
            ? '<div class="slot-plan">' +
                '<div class="slot-plan-main">' +
                  (tp ? '<span class="tag blue">选题</span>' : '<span class="tag orange">文案</span>') +
                  "<b>" + Core.escapeHtml(tp ? tp.title : item.text) + "</b>" +
                "</div>" +
                '<div class="slot-note">' + (item.status || "待排") + (t ? " · " + t.name : "") + "</div>" +
              "</div>"
            : '<div class="slot-note">暂未安排</div>') +
          '<div class="slot-act">' +
            (item.status === "待发布"
              ? '<button class="btn soft small" onclick="App.publishSlot(\'' + s.id + '\')">标记已发布</button>'
              : '<button class="btn ghost small" onclick="App.fillSlot(\'' + s.id + '\')">去创作</button>') +
            (has ? '<button class="btn ghost small" onclick="App.clearSlot(\'' + s.id + '\')">移出</button>' : "") +
          "</div>" +
        "</div>"
      );
    }).join("");

    return (
      '<div class="page">' +
        UI.head("发布时间排期", "选题 + 时段，可自由调换", "", true) +
        '<div class="notice">' + icon("clock", 15) +
          "<span>每天 0 点自动按今日选题生成一版排期；点「安排 / 改时段」可以把任意选题放到任意时段，已有选题会自动换位，不会丢内容。</span>" +
        "</div>" +
        '<div class="section-title"><h2>今日选题</h2><span>' + planned + " / " + topicList.length + " 已安排</span></div>" +
        '<div class="card" style="padding:2px 14px">' + (topicRows || UI.empty("今天还没有选题，去选题库添加", "bulb")) + "</div>" +
        '<div class="section-title"><h2>今日时段</h2><span>' + Core.todayKey() + "</span></div>" +
        cards +
        '<div class="hint">' + icon("bulb", 14) +
          "<span>时段顺序按「黄金 40% 干货 / 30% 生活 / 20% 互动 / 10% 转化」推荐，每天 2-4 条，间隔至少 2 小时。</span></div>" +
      "</div>"
    );
  }

  /* ---------- 人设资料库（注册用户自行填写） ---------- */
  function avatarHtml() {
    const u = store.user || {};
    if (u.avatar) {
      return '<div class="profile-avatar"><img src="' + Core.escapeHtml(u.avatar) + '" alt="头像" /></div>';
    }
    const ch = [...(u.name || "我")][0] || "我";
    return '<div class="profile-avatar">' + Core.escapeHtml(ch) + "</div>";
  }

  function renderProfile() {
    const u = store.user || {};
    const filled = store.profileSections.filter((s) => s.content).length;
    const rows = store.profileSections.map((s, i) =>
      '<div class="section-item" onclick="App.editSection(\'' + s.id + '\')">' +
        '<div class="section-num">' + (i + 1 < 10 ? "0" : "") + (i + 1) + "</div>" +
        '<div class="section-body"><b>' + s.title + "</b><span>" +
          (s.content ? Core.escapeHtml(s.summary) : "待填写 · 点击录入") + "</span></div>" +
        icon("right", 16) +
      "</div>"
    ).join("");

    return (
      '<div class="page">' +
        UI.head("我的资料", "填写后用于生成文案 / 选题 / 排期", "", true) +
        '<input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="App.onAvatarFile(this)" />' +
        '<div class="profile-hero">' +
          '<div class="avatar-wrap" onclick="App.pickAvatar()">' + avatarHtml() +
            '<i class="avatar-edit">换</i></div>' +
          '<div><div class="profile-name">' + Core.escapeHtml(u.name || "未设置昵称") +
            '<button class="btn soft small" style="margin-left:8px" onclick="App.editName()">改昵称</button></div>' +
            '<div class="profile-tag">' + Core.escapeHtml(u.tagline || "点击下方「一句话标签」完善资料") + "</div></div>" +
          '<span class="profile-badge' + (filled ? "" : " off") + '">' + (filled ? "已填 " + filled + "/7" : "待完善") + "</span>" +
        "</div>" +
        '<div class="prof-actions">' +
          '<button class="btn ghost small" onclick="App.editTagline()">一句话标签</button>' +
          '<button class="btn ghost small" onclick="App.editPerspectives()">身份标签</button>' +
          (u.avatar ? '<button class="btn ghost small" onclick="App.removeAvatar()">移除头像</button>' : "") +
        "</div>" +
        ((u.perspectives || []).length
          ? '<div class="persp">' + u.perspectives.map((p) => "<span>" + Core.escapeHtml(p) + "</span>").join("") + "</div>"
          : "") +
        '<div class="section-title"><h2>资料模块</h2><span>' + filled + " / 7 已填写</span></div>" +
        '<div class="card" style="padding:2px 14px">' + rows + "</div>" +
        '<div class="hint">' + icon("shield", 14) +
          "<span>资料按登录账号独立保存；生成文案时会参考「身份 / 产品 / 客户 / 表达风格」，素材库中你上传的内容也会参与生成。</span>" +
        "</div>" +
      "</div>"
    );
  }

  /* ---------- 历史记录 ---------- */
  // 图片 / 视频记录的缩略预览
  function histMedia(h) {
    const md = h.media || {};
    if (h.kind === "image") {
      const src = md.src || md.url || "";
      if (!src) return "";
      return '<img class="hist-media" src="' + Core.escapeHtml(src) + '" alt="" loading="lazy" onclick="App.previewHistoryMedia(\'' + h.id + '\')" />';
    }
    if (h.kind === "video") {
      if (md.url) return '<video class="hist-media" controls playsinline preload="metadata" src="' + Core.escapeHtml(md.url) + '"></video>';
      if (md.local) return '<div class="hist-media none">已保存到手机相册，可在相册播放</div>';
      return '<div class="hist-media none">未提供视频文件</div>';
    }
    return "";
  }

  function renderHistory() {
    const tab = ui.historyTab || "gen";
    let body = "";
    if (tab === "gen") {
      const rows = store.history.map((h) => {
        const t = Core.typeById(h.type);
        const media = histMedia(h);
        return (
          '<div class="hist-item">' +
            '<div class="hist-top">' +
              '<span class="tag ' + (h.status === "已拦截" ? "red" : "green") + '">' + h.status + "</span>" +
              '<span class="tag gray">' + (t ? t.name : h.typeName || "") + "</span>" +
              '<span class="tag blue">' + h.mode + "</span>" +
              '<span class="time">' + Core.timeAgo(h.time) + "</span>" +
            "</div>" +
            media +
            '<div class="hist-text">' + Core.escapeHtml(h.kind && h.kind !== "text" ? (h.title || h.text) : h.text) + "</div>" +
          "</div>"
        );
      }).join("");
      body = rows || UI.empty("还没有生成记录", "clock");
    } else {
      body = store.blocks.map((b) =>
        '<div class="hist-item blocked">' +
          '<div class="hist-top"><span class="tag red">已拦截</span><span class="tag orange">' + b.category + "</span>" +
            '<span class="time">' + Core.timeAgo(b.time) + "</span></div>" +
          histMedia(b) +
          '<div class="block-detail">' +
            '<div class="block-row"><b>违规原因：</b>' + b.reason + "</div>" +
            '<div class="block-row"><b>违规内容：</b>' + Core.escapeHtml(b.original) + "</div>" +
            (b.replaced ? '<div class="block-row"><b>替换内容：</b><em>' + Core.escapeHtml(b.replaced) + "</em></div>" : "") +
            '<div class="block-row" style="color:#9AA0A7">来源：' + b.source + (b.word ? " · " + b.word : "") + "</div>" +
          "</div>" +
        "</div>"
      ).join("") || UI.empty("没有被拦截的记录，很好", "shield");
    }

    return (
      '<div class="page">' +
        UI.head("历史生成记录", "复盘、迭代与再次调用", "", true) +
        '<div class="tabs">' +
          '<button class="' + (tab === "gen" ? "active" : "") + '" onclick="App.setHistoryTab(\'gen\')">生成记录</button>' +
          '<button class="' + (tab === "block" ? "active" : "") + '" onclick="App.setHistoryTab(\'block\')">拦截记录 ' + store.blocks.length + "</button>" +
        "</div>" + body +
      "</div>"
    );
  }

  /* ---------- 合规检测 ---------- */
  function renderCompliance() {
    const r = ui.checkResult;
    const src = ui.checkInput || "";
    const byCat = {};
    store.words.forEach((w) => { (byCat[w.c] = byCat[w.c] || []).push(w.w); });

    const resultHtml = !r ? "" :
      '<div class="compliance ' + (r.passed ? "pass" : "fail") + '" style="margin-top:12px">' +

  /* ---------- 检查更新 ---------- */
  function curVer() {
    return (window.App && App.currentVersion) ? App.currentVersion() : { code: 0, name: "网页版" };
  }

  function updateMenuNote() {
    const s = (window.App && App.updateState) ? App.updateState() : null;
    if (s && s.state === "done") {
      if (s.hasNew) return "有新版本 v" + ((s.latest && s.latest.versionName) || "");
      return "已是最新";
    }
    if (s && s.state === "error") return "点此重试";
    return "当前 v" + curVer().name;
  }

  function fmtSize(n) {
    const v = Number(n) || 0;
    if (!v) return "";
    return v > 1048576 ? (v / 1048576).toFixed(1) + " MB" : Math.round(v / 1024) + " KB";
  }

  function renderUpdate() {
    const s = (window.App && App.updateState) ? App.updateState() : { state: "idle" };
    const cur = curVer();
    const nativeMode = !!(window.NativeApp && NativeApp.available());
    // 进入页面自动检查一次
    if (s.state === "idle" && !s.auto) {
      s.auto = true;
      setTimeout(() => { if (window.App) App.checkUpdate(); }, 80);
    }
    const latest = s.latest || {};
    const notes = (Array.isArray(latest.notes) ? latest.notes : [])
      .slice(0, 8)
      .map((t) => '<div class="map-row"><span>' + Core.escapeHtml(String(t)) + "</span></div>")
      .join("");

    let body = "";
    if (s.state === "checking") {
      body = '<div class="card mt12"><div class="muted">正在联网检查更新…</div></div>';
    } else if (s.state === "install") {
      body = '<div class="card mt12"><div class="muted">正在下载安装包，请保持网络畅通，不要退出 App…</div></div>';
    } else if (s.state === "error") {
      body = '<div class="compliance fail mt12"><div class="comp-head">' + icon("alert", 15) +
        '检查失败</div><div class="comp-desc">' + Core.escapeHtml(s.error || "无法连接更新服务") + "</div></div>";
    } else if (s.state === "done" && s.hasNew) {
      body = '<div class="card mt12">' +
        '<div style="display:flex;align-items:center;justify-content:space-between">' +
          '<b style="font-size:14px">发现新版本 v' + Core.escapeHtml(latest.versionName || "") + "</b>" +
          '<em style="font-style:normal;font-size:12px;color:#9AA0A6">当前 v' + Core.escapeHtml(cur.name) + "</em>" +
        "</div>" +
        (notes ? '<div style="margin-top:10px">' + notes + "</div>" : "") +
        '<div class="muted" style="margin-top:10px">' +
          (latest.size ? "安装包 " + fmtSize(latest.size) + "，" : "") +
          "覆盖安装后，本机文案、资料与会员状态都会保留。</div>" +
        (nativeMode
          ? '<button class="btn primary block mt12" onclick="App.installUpdate()">' +
            icon("refresh", 16) + "立即更新到 v" + Core.escapeHtml(latest.versionName || "") + "</button>"
          : '<div class="muted" style="margin-top:10px">网页版无法安装更新，请在 App 内点「检查更新」完成升级。</div>') +
        "</div>";
    } else if (s.state === "done") {
      body = '<div class="card mt12">' +
        '<div style="display:flex;align-items:center;justify-content:space-between">' +
          "<b style=\"font-size:14px\">已是最新版本</b>" +
          '<em style="font-style:normal;font-size:12px;color:#9AA0A6">v' + Core.escapeHtml(cur.name) + "</em>" +
        "</div>" +
        (s.checkedAt ? '<div class="muted" style="margin-top:6px">检查时间：' + Core.timeAgo(s.checkedAt) + "</div>" : "") +
        "</div>";
    } else {
      body = '<div class="card mt12"><div class="muted">点下方按钮联网检查是否有新版本。</div></div>';
    }

    return (
      '<div class="page">' +
        UI.head("检查更新", "联网获取最新版本", "", true) +
        '<div class="card mt12">' +
          '<div style="display:flex;align-items:center;justify-content:space-between">' +
            '<b style="font-size:13.5px">当前版本</b>' +
            '<em style="font-style:normal;font-size:12px;color:#9AA0A6">v' + Core.escapeHtml(cur.name) +
              (cur.code ? "（" + cur.code + "）" : "") + "</em>" +
          "</div>" +
        "</div>" +
        '<div class="card mt12">' +
          '<div style="font-size:13px;font-weight:600;margin-bottom:8px">永久更新源</div>' +
          '<input class="input" id="updSrc" placeholder="https://cdn.jsdelivr.net/gh/用户名/仓库@main/version.json" value="' +
            Core.escapeHtml((store.settings && store.settings.updateUrl) || "") + '" />' +
          '<div class="muted" style="font-size:11px;margin-top:6px;line-height:1.6">留空使用内置地址（ntfy + 临时隧道）。建议填 GitHub + jsDelivr 的固定地址，换网络、重启都不会失效。</div>' +
          '<button class="btn ghost block mt12" onclick="App.saveUpdateUrl()">' + icon("refresh", 16) + "保存更新源并检查</button>" +
        "</div>" +
        body +
        (s.error && s.state !== "error"
          ? '<div class="compliance fail mt12"><div class="comp-head">' + icon("alert", 15) +
            '更新未完成</div><div class="comp-desc">' + Core.escapeHtml(s.error) + "</div></div>"
          : "") +
        '<button class="btn ghost block mt12" onclick="App.checkUpdate()">' + icon("refresh", 16) +
          (s.state === "checking" ? "检查中…" : "检查更新") + "</button>" +
        '<div class="hint" style="margin-top:14px">' + icon("refresh", 13) +
          "<span>" + (nativeMode
            ? "更新为覆盖安装，不会清除本机已生成的文案、资料与会员状态。首次更新需在系统提示里允许「安装未知应用」。"
            : "网页版无法安装更新，升级请在手机 App 内点「检查更新」完成。") +
          "</span>" +
        "</div>" +
      "</div>"
    );
  }
