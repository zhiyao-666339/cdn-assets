<script>
/* cloud.js */
/* 云端账号 + 数据同步（Supabase 免费版）
 * - 纯浏览器 fetch，网页版与 App（WebView）行为一致
 * - 账号：手机号或邮箱 + 密码（手机号会自动转成 手机号@pyq.local）
 * - 数据表：public.pyq_data(user_id uuid primary key, payload jsonb, updated_at timestamptz)
 * - 策略：整包 last-write-wins；每次本地保存后防抖 2.5 秒自动上传
 */
(function () {
  const SESSION_KEY = "pyq_cloud_session";
  const TABLE = "pyq_data";
  const PUSH_DELAY = 2500;
  const MAX_BYTES = 6 * 1024 * 1024; // 单次上传体积上限，超出时丢弃内联图片

  let session = loadSession();
  let timer = null;
  let pushing = false;
  let suspended = false;
  let state = { lastPush: "", lastPull: "", error: "", busy: false };

  const listeners = [];
  function emit() { listeners.forEach((fn) => { try { fn(state); } catch (e) {} }); }

  function cfg() {
    const s = (window.Core && Core.store && Core.store.settings) || {};
    const c = s.cloud || {};
    return {
      url: String(c.url || "").trim().replace(/\/+$/, ""),
      key: String(c.key || "").trim(),
      account: String(c.account || "").trim(),
      auto: c.auto !== false
    };
  }
  function configured() { const c = cfg(); return !!(c.url && c.key); }
  function hasSession() { return !!(session && session.access_token && session.user && session.user.id); }
  function user() { return hasSession() ? session.user : null; }

  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch (e) { return null; }
  }
  function saveSession(s) {
    session = s;
    try {
      if (s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
      else localStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function toEmail(account) {
    const a = String(account || "").trim();
    if (!a) return "";
    if (a.indexOf("@") >= 0) return a;
    const phone = a.replace(/\D/g, "");
    return phone.length === 11 ? phone + "@pyq.local" : a + "@pyq.local";
  }

  function errText(data, fallback) {
    if (!data) return fallback || "请求失败";
    return data.msg || data.error_description || data.error || data.message || fallback || "请求失败";
  }

  async function call(path, opts) {
    const c = cfg();
    if (!c.url || !c.key) throw new Error("请先填写 Supabase 地址和 anon key");
    const o = opts || {};
    const headers = Object.assign(
      { apikey: c.key, "Content-Type": "application/json" },
      o.headers || {}
    );
    if (o.auth !== false) {
      const token = await ensureToken();
      if (token) headers.Authorization = "Bearer " + token;
    }
    const res = await fetch(c.url + path, {
      method: o.method || "GET",
      headers: Object.assign(headers, o.prefer ? { Prefer: o.prefer } : {}),
      body: o.body ? JSON.stringify(o.body) : undefined
    });
    let data = null;
    const text = await res.text();
    if (text) {
      try { data = JSON.parse(text); } catch (e) { data = text; }
    }
    if (!res.ok) {
      const e = new Error(errText(data, "HTTP " + res.status));
      e.status = res.status;
      e.data = data;
      throw e;
    }
    return data;
  }

  /* ---------- 登录态 ---------- */
  async function ensureToken() {
    if (!hasSession()) return null;
    const exp = Number(session.expires_at || 0);
    if (exp && exp - 60 > Math.floor(Date.now() / 1000)) return session.access_token;
    const c = cfg();
    const res = await fetch(c.url + "/auth/v1/token?grant_type=refresh_token", {
      method: "POST",
      headers: { apikey: c.key, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data || !data.access_token) {
      saveSession(null);
      throw new Error(errText(data, "登录已过期，请重新登录"));
    }
    saveSession(normalizeSession(data));
    return session.access_token;
  }

  function normalizeSession(data) {
    const expiresAt = Math.floor(Date.now() / 1000) + Number(data.expires_in || 3600);
    return {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: expiresAt,
      user: data.user || (session && session.user) || null
    };
  }

  async function signUp(account, password) {
    const email = toEmail(account);
    if (!email) return { ok: false, error: "请填写手机号或邮箱" };
    if (!password || password.length < 6) return { ok: false, error: "密码至少 6 位" };
    try {
      const data = await call("/auth/v1/signup", {
        method: "POST", auth: false, body: { email: email, password: password }
      });
      if (!data || !data.access_token) {
        return { ok: false, needConfirm: true, error: "注册成功，但 Supabase 开启了邮箱验证。请到 Supabase → Authentication → Providers → Email 关闭 Confirm email 后再登录。" };
      }
      saveSession(normalizeSession(data));
      return { ok: true, user: session.user };
    } catch (e) {
      const msg = (e && e.message) || "注册失败";
      return { ok: false, error: /already|registered|exists/i.test(msg) ? "该账号已注册，请直接登录" : msg };
    }
  }

  async function signIn(account, password) {
    const email = toEmail(account);
    if (!email) return { ok: false, error: "请填写手机号或邮箱" };
    if (!password) return { ok: false, error: "请填写密码" };
    try {
      const data = await call("/auth/v1/token?grant_type=password", {
        method: "POST", auth: false, body: { email: email, password: password }
      });
      if (!data || !data.access_token) return { ok: false, error: "账号或密码不正确" };
      saveSession(normalizeSession(data));
      return { ok: true, user: session.user };
    } catch (e) {
      const msg = (e && e.message) || "登录失败";
      return { ok: false, error: /invalid|credential/i.test(msg) ? "账号或密码不正确" : msg };
    }
  }

  async function signOut() {
    const c = cfg();
    const token = session && session.access_token;
    saveSession(null);
    if (c.url && token) {
      try {
        await fetch(c.url + "/auth/v1/logout", {
          method: "POST", headers: { apikey: c.key, Authorization: "Bearer " + token }
        });
      } catch (e) {}
    }
    emit();
    return { ok: true };
  }

  /* ---------- 数据快照 ---------- */
  function snapshot() {
    const s = Core.store;
    const snap = {
      user: s.user,
      profileSections: s.profileSections,
      profileVersion: s.profileVersion,
      profiles: s.profiles,
      currentPhone: s.currentPhone,
      types: s.types,
      slots: s.slots,
      topics: s.topics,
      materials: s.materials,
      drafts: s.drafts,
      history: s.history,
      blocks: s.blocks,
      schedule: s.schedule,
      dailyDate: s.dailyDate,
      todayTopics: s.todayTopics,
      recentTopicIds: s.recentTopicIds,
      topicCycle: s.topicCycle,
      words: s.words,
      rules: s.rules,
      rulesVersion: s.rulesVersion,
      rulesLiveVersion: s.rulesLiveVersion,
      seedCleaned: s.seedCleaned,
      cloudUpdatedAt: s.cloudUpdatedAt || ""
    };

    // 体积保护：内联图片过大时丢弃 dataURL，避免上传失败
    let json = JSON.stringify(snap);
    if (json.length > MAX_BYTES) {
      if (snap.materials && snap.materials.images) {
        snap.materials.images = snap.materials.images.map((img) => {
          if (/^data:/.test(img.src || "")) {
            const copy = Object.assign({}, img);
            copy.src = "";
            copy.srcSkipped = true;
            return copy;
          }
          return img;
        });
      }
      json = JSON.stringify(snap);
    }
    return { payload: snap, size: json.length };
  }

  function applyRemote(payload, updatedAt) {
    if (!payload) return false;
    suspended = true;
    try {
      const s = Core.store;
      const localSettings = s.settings;
      Object.keys(s).forEach((k) => { delete s[k]; });
      Object.assign(s, payload);
      s.settings = localSettings || {};
      s.cloudUpdatedAt = updatedAt || payload.cloudUpdatedAt || "";
      // 兜底默认值，避免旧数据缺少字段导致页面报错
      if (!s.materials) s.materials = { copy: [], images: [], videos: [] };
      if (!s.profiles) s.profiles = {};
      if (!s.dailyDate) s.dailyDate = "";
      Core.save();
    } finally {
      suspended = false;
    }
    return true;
  }

  /* ---------- 上传 / 下载 ---------- */
  async function push(silent) {
    if (!configured() || !hasSession()) return { ok: false, error: "未登录云账号" };
    if (pushing) return { ok: false, error: "正在上传" };
    pushing = true;
    state.busy = true;
    emit();
    try {
      const c = cfg();
      const u = user();
      const snap = snapshot();
      await call("/rest/v1/" + TABLE + "?on_conflict=user_id", {
        method: "POST",
        prefer: "resolution=merge-duplicates,return=minimal",
        body: [{ user_id: u.id, payload: snap.payload, updated_at: new Date().toISOString() }]
      });
      const now = new Date().toISOString();
      Core.store.cloudUpdatedAt = now;
      try { localStorage.setItem("pyq_store_v1", JSON.stringify(Core.store)); } catch (e) {}
      state.lastPush = now;
      state.error = "";
      if (!silent && window.App && App.toast) App.toast("已上传到云端");
      return { ok: true, size: snap.size };
    } catch (e) {
      state.error = (e && e.message) || "上传失败";
      if (!silent && window.App && App.toast) App.toast("云端上传失败：" + state.error);
      return { ok: false, error: state.error };
    } finally {
      pushing = false;
      state.busy = false;
      emit();
    }
  }

  async function pull(apply) {
    if (!configured() || !hasSession()) return { ok: false, error: "未登录云账号" };
    try {
      const u = user();
      const rows = await call("/rest/v1/" + TABLE + "?select=payload,updated_at&user_id=eq." + encodeURIComponent(u.id));
      const row = Array.isArray(rows) ? rows[0] : rows;
      if (!row) return { ok: true, empty: true };
      if (apply !== false) applyRemote(row.payload, row.updated_at);
      state.lastPull = row.updated_at || "";
      state.error = "";
      return { ok: true, row: row };
    } catch (e) {
      state.error = (e && e.message) || "拉取失败";
      return { ok: false, error: state.error };
    }
  }

  /* 登录后对齐：云端更新则覆盖本地，否则把本地推上去 */
  async function reconcile(silent) {
    if (!configured() || !hasSession()) return { ok: false };
    const r = await pull(false);
    if (!r.ok) return r;
    const local = Core.store.cloudUpdatedAt || "";
    if (r.empty) {
      const p = await push(true);
      return { ok: p.ok, direction: "up" };
    }
    const remoteAt = r.row.updated_at || "";
    if (remoteAt > local) {
      applyRemote(r.row.payload, remoteAt);
      if (!silent && window.App) { App.toast("已从云端同步最新内容"); App.render(true); }
      return { ok: true, direction: "down" };
    }
    const p = await push(true);
    return { ok: p.ok, direction: "up" };
  }

  /* ---------- 自动同步 ---------- */
  function markDirty() {
    if (suspended) return;
    if (!configured() || !hasSession()) return;
    if (!cfg().auto) return;
    clearTimeout(timer);
    timer = setTimeout(() => { push(true).then(() => emit()); }, PUSH_DELAY);
  }

  async function init() {
    if (!configured() || !hasSession()) return;
    try { await reconcile(true); } catch (e) {}
    emit();
  }

  function onChange(fn) { listeners.push(fn); }

  window.Cloud = {
    configured, hasSession, user, signUp, signIn, signOut,
    push, pull: (apply) => pull(apply), reconcile, markDirty, init,
    state: () => state, onChange, toEmail,
    applyRemote: (payload, updatedAt) => applyRemote(payload, updatedAt),
    snapshot
  };
})();

</script>
<script>
/* native-app.js */
/* Android App 桥接层：在独立安装的 App 内替代本地服务端
 * - 未配置服务器地址时：图片/视频直接保存到手机相册，文本归档写入 App 私有目录
 * - 配置了服务器地址时：沿用现有 /api/upload 与 /api/sync 上传飞书云盘
 */
(function () {
  const B = window.AndroidBridge;
  if (!B || typeof B.isNative !== "function") {
    window.NativeApp = { available: () => false };
    return;
  }

  let seq = 0;
  const waiters = {};

  function resolveCallback(id, payload) {
    const fn = waiters[id];
    if (!fn) return;
    delete waiters[id];
    let data = payload;
    if (typeof payload === "string") {
      try {
        data = JSON.parse(payload);
      } catch (e) {
        data = { ok: false, error: "原生返回解析失败" };
      }
    }
    fn(data || { ok: false, error: "未知错误" });
  }

  function call(method, args) {
    return new Promise((resolve) => {
      const cid = "n" + (++seq);
      waiters[cid] = resolve;
      try {
        if (method === "uploadPicked") B.uploadPicked(args[0], args[1], args[2], cid);
        else if (method === "uploadBytes") B.uploadBytes(args[0], args[1], args[2], cid);
        else if (method === "syncText") B.syncText(args[0], cid);
        else if (method === "exportArchive") B.exportArchive(cid);
        else if (method === "serverTime") B.serverTime(cid);
        else if (method === "checkUpdate") B.checkUpdate(args[0], cid);
        else if (method === "installUpdate") B.installUpdate(args[0], cid);
        else if (method === "genImage") B.genImage(args[0], args[1], args[2], args[3], args[4], cid);
        else if (method === "saveMediaUrl") B.saveMediaUrl(args[0], args[1], !!args[2], cid);
        else resolve({ ok: false, error: "未知原生方法：" + method });
      } catch (e) {
        delete waiters[cid];
        resolve({ ok: false, error: "原生调用失败：" + ((e && e.message) || e) });
      }
    });
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || "").split(",")[1] || "");
      fr.onerror = () => reject(new Error("读取文件失败"));
      fr.readAsDataURL(blob);
    });
  }

  function serverUrl() {
    try {
      return (B.getServer() || "").trim().replace(/\/+$/, "");
    } catch (e) {
      return "";
    }
  }

  function pickFail(r) {
    return r && r.code === "not_found";
  }

  /* 上传：优先用文件选择时已缓存到原生的原文件（视频零拷贝），否则走 base64 */
  async function upload(folder, name, blob, onProgress) {
    const notify = (p) => { if (onProgress) onProgress(p); };
    notify(5);

    if (blob && blob.name) {
      const r = await call("uploadPicked", [folder, name, blob.name]);
      if (!pickFail(r)) {
        notify(100);
        return r;
      }
    }
    const b64 = await blobToBase64(blob);
    notify(55);
    const r = await call("uploadBytes", [folder, name, b64]);
    notify(100);
    return r;
  }

  /* 文本归档同步：本地模式下写入 App 私有目录；有服务器则走原生 HTTP */
  async function sync(items) {
    const list = (items || []).filter((it) => !/图片库|视频库/.test(it.folder || ""));
    if (!list.length) return { ok: true, synced: 0, failed: 0, local: !serverUrl() };
    return call("syncText", [JSON.stringify(list)]);
  }

  function builtinRules() {
    try {
      const raw = B.builtinRules();
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  window.NativeApp = {
    available: () => true,
    hasServer: () => !!serverUrl(),
    serverUrl: serverUrl,
    setServer: (v) => {
      try {
        B.setServer(String(v || "").trim());
        return true;
      } catch (e) {
        return false;
      }
    },
    upload,
    sync,
    // 联网校时：原生发 HTTPS 请求取 Date 响应头
    serverTime: () => call("serverTime", []),
    // 归档导出：把私有目录的文案复制到公共 Documents
    exportArchive: () => call("exportArchive", []),
    // 检查更新：拉取远程版本清单 / 下载并拉起安装器
    versionInfo: () => {
      try {
        return JSON.parse(B.versionInfo() || "{}");
      } catch (e) {
        return {};
      }
    },
    checkUpdate: (manifestUrl) => call("checkUpdate", [manifestUrl]),
    installUpdate: (apkUrl) => call("installUpdate", [apkUrl]),
    // AI 生成图片：走用户自己配置的接口，生成后直接存入相册
    genImage: (base, key, model, prompt, size) => call("genImage", [base, key, model, prompt, size]),
    // 把网络图片/视频保存到手机相册
    saveMediaUrl: (url, name, isVideo) => call("saveMediaUrl", [url, name, !!isVideo]),
    builtinRules,
    toast: (msg) => { try { B.toast(String(msg)); } catch (e) {} },
    __cb: resolveCallback,
    __progress: () => {}
  };

  // 原生回调统一入口（原生通过 evaluateJavascript 调用）
  window.__nativeResolve = (id, payload) => resolveCallback(id, payload);

  // 系统状态栏由 Android 绘制，隐藏页面自绘的状态栏
  document.documentElement.classList.add("native-app");
})();

</script>
<script>
/* auth.js */
/* 账号 + 会员系统
 * - 未登录：全屏遮罩，必须先注册 / 登录才能使用
 * - 登录方式：密码登录 / 短信验证码登录 / 手机号注册
 * - 密码：数字、字母、符号自由组合，实时显示安全强度
 * - 会员：注册起免费试用 7 天；到期后全屏弹窗选择档位扫码付费，凭激活码开通
 */
(function () {
  const B = window.AndroidBridge;
  const isNative = !!(B && typeof B.isNative === "function");
  const DAY = 24 * 60 * 60 * 1000;
  const WX_ID = "zhiyao0a1";

  const TIERS = [
    { tier: 1, name: "月会员", price: 9.9, days: 30, tag: "灵活体验" },
    { tier: 2, name: "季度会员", price: 19.9, days: 90, tag: "省 33%" },
    { tier: 3, name: "年度会员", price: 59.9, days: 365, tag: "最划算" },
    { tier: 4, name: "永久会员", price: 99, days: 0, tag: "一次买断" }
  ];

  let seq = 0;
  const waiters = {};

  function resolveCallback(id, payload) {
    const fn = waiters[id];
    if (!fn) return;
    delete waiters[id];
    let data = payload;
    if (typeof payload === "string") {
      try { data = JSON.parse(payload); } catch (e) { data = { ok: false, error: "原生返回解析失败" }; }
    }
    fn(data || { ok: false, error: "未知错误" });
  }

  /* 原生回调统一分发：先匹配账号模块的 waiter，未命中再交给 native-app 的上传/同步回调 */
  (function bindNativeCallback() {
    const app = window.NativeApp;
    if (!app) return;
    const prev = typeof app.__cb === "function" ? app.__cb : null;
    app.__cb = function (id, payload) {
      if (waiters[id]) { resolveCallback(id, payload); return; }
      if (prev) prev(id, payload);
    };
  })();

  function call(method, args) {
    return new Promise((resolve) => {
      const cid = "a" + (++seq);
      waiters[cid] = resolve;
      const a = args || [];
      try {
        if (method === "authGetMe") B.authGetMe(cid);
        else if (method === "authLogin") B.authLogin(a[0], a[1], cid);
        else if (method === "authRegister") B.authRegister(a[0], a[1], a[2], cid);
        else if (method === "authChangeName") B.authChangeName(a[0], cid);
        else if (method === "authChangePassword") B.authChangePassword(a[0], a[1], cid);
        else if (method === "authLogout") B.authLogout(cid);
        else if (method === "authSendCode") B.authSendCode(a[0], cid);
        else if (method === "authVerifyCode") B.authVerifyCode(a[0], a[1], cid);
        else if (method === "authMember") B.authMember(cid);
        else if (method === "authPurchase") B.authPurchase(a[0], cid);
        else if (method === "authActivate") B.authActivate(a[0], cid);
        else if (method === "authGenCode") B.authGenCode(a[0], a[1], a[2], cid);
        else { delete waiters[cid]; resolve({ ok: false, error: "未知原生方法：" + method }); }
      } catch (e) {
        delete waiters[cid];
        resolve({ ok: false, error: "原生调用失败" });
      }
    });
  }

  /* ---------------- Web 预览：localStorage 模拟 ---------------- */

  const FAKE_KEY = "pyq_fake_accounts";
  const FAKE_SESSION = "pyq_fake_session";

  function fakeAccounts() {
    try { return JSON.parse(localStorage.getItem(FAKE_KEY) || "{}"); } catch (e) { return {}; }
  }
  function fakeSave(acc) { localStorage.setItem(FAKE_KEY, JSON.stringify(acc)); }
  function fakeSha(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16).padStart(8, "0");
  }
  function normPhone(p) { return String(p || "").replace(/\D/g, ""); }
  function phoneOK(p) { return /^1\d{10}$/.test(p); }
  function pwdOK(p) { return !!p && p.length >= 6 && p.length <= 32 && !/\s/.test(p); }
  function pwdError(p) {
    if (!p) return "请设置登录密码";
    if (p.length < 6) return "密码至少 6 位";
    if (p.length > 32) return "密码不超过 32 位";
    if (/\s/.test(p)) return "密码不能包含空格";
    return null;
  }

  function fakeMember(acc) {
    const now = Date.now();
    const trialEnd = (acc.trialStart || now) + 7 * DAY;
    const tier = acc.tier || 0;
    const expires = acc.expires || 0;
    const paid = tier === 4 || (tier >= 1 && expires > now);
    const trial = trialEnd > now;
    let daysLeft = 0;
    if (tier === 4) daysLeft = -1;
    else if (paid) daysLeft = Math.ceil((expires - now) / DAY);
    else if (trial) daysLeft = Math.ceil((trialEnd - now) / DAY);
    return {
      status: paid ? "active" : trial ? "trial" : "expired",
      active: paid || trial,
      tier: tier,
      tierName: (TIERS.find((t) => t.tier === tier) || {}).name || (tier === 0 ? "免费试用" : ""),
      price: (TIERS.find((t) => t.tier === tier) || {}).price || "",
      expiresAt: expires,
      trialEndsAt: trialEnd,
      daysLeft: daysLeft,
      pendingTier: acc.pending || 0,
      pendingTierName: (TIERS.find((t) => t.tier === (acc.pending || 0)) || {}).name || "",
      trialDays: 7
    };
  }

  function nickError(n) {
    const s = String(n || "").trim();
    if (!s) return "请填写昵称";
    if ([...s].length > 20) return "昵称最多 20 个字";
    return null;
  }

  function fakeMe(phone, acc) {
    return {
      phone: phone,
      name: acc.name || "",
      masked: phone.slice(0, 3) + "****" + phone.slice(7),
      member: fakeMember(acc)
    };
  }

  /* ---------------- 对外 API ---------------- */

  async function getMe() {
    if (isNative) {
      const r = await call("authGetMe", []);
      return r && r.ok && r.loggedIn ? (r.me || null) : null;
    }
    const phone = localStorage.getItem(FAKE_SESSION) || "";
    const acc = fakeAccounts()[phone];
    return phone && acc ? fakeMe(phone, acc) : null;
  }

  /* ---------------- 云端账号兜底：同一手机号在任意版本都能登录 ---------------- */

  function cloudReady() {
    return !!(window.Cloud && Cloud.configured());
  }

  // 本地没有该账号（或密码不一致）时，用云端账号验证身份并自动补建本地账号
  async function cloudSignInFallback(phone, password) {
    if (!cloudReady() || Cloud.hasSession()) return null;
    let r;
    try { r = await Cloud.signIn(phone, password); } catch (e) { return null; }
    if (!r || !r.ok) return null;
    Cloud.init().then(() => {
      if (window.App && App.render) App.render(true);
    }).catch(() => {});
    return { name: "用户" + phone.slice(-4) };
  }

  // 注册时同步创建云端账号，让其他版本可以用同一账号登录
  async function cloudSignUpQuiet(phone, nickname, password) {
    if (!cloudReady() || Cloud.hasSession()) return;
    try {
      const r = await Cloud.signUp(phone, password);
      if (r && r.ok) await Cloud.push(true);
    } catch (e) {}
  }

  async function login(phone, password) {
    phone = normPhone(phone);
    if (!phoneOK(phone)) return { ok: false, error: "请输入 11 位有效手机号" };
    const e = pwdError(password);
    if (e) return { ok: false, error: e };
    if (isNative) {
      const r = await call("authLogin", [phone, password]);
      if (r && r.ok) return r;
      const cl = await cloudSignInFallback(phone, password);
      if (cl) {
        const reg = await call("authRegister", [phone, cl.name, password]);
        if (reg && reg.ok) return call("authLogin", [phone, password]);
      }
      return r;
    }

    const acc = fakeAccounts();
    if (!acc[phone] || acc[phone].hash !== fakeSha(password)) {
      const cl = await cloudSignInFallback(phone, password);
      if (cl) {
        acc[phone] = acc[phone] || { name: cl.name, trialStart: Date.now(), tier: 0, expires: 0, pending: 0 };
        acc[phone].hash = fakeSha(password);
        fakeSave(acc);
        localStorage.setItem(FAKE_SESSION, phone);
        return { ok: true, me: fakeMe(phone, acc[phone]), cloud: true, msg: "已通过云端账号登录" };
      }
      if (!acc[phone]) return { ok: false, error: "该手机号未注册，请先注册" };
      return { ok: false, error: "密码错误" };
    }
    localStorage.setItem(FAKE_SESSION, phone);
    return { ok: true, me: fakeMe(phone, acc[phone]) };
  }

  async function register(phone, nickname, password) {
    phone = normPhone(phone);
    nickname = String(nickname || "").trim();
    if (!phoneOK(phone)) return { ok: false, error: "请输入 11 位有效手机号" };
    const ne = nickError(nickname);
    if (ne) return { ok: false, error: ne };
    const e = pwdError(password);
    if (e) return { ok: false, error: e };
    if (isNative) {
      const r = await call("authRegister", [phone, nickname, password]);
      if (r && r.ok) cloudSignUpQuiet(phone, nickname, password);
      return r;
    }

    const acc = fakeAccounts();
    if (acc[phone]) return { ok: false, error: "该手机号已注册，请直接登录" };
    acc[phone] = { name: nickname, hash: fakeSha(password), trialStart: Date.now(), tier: 0, expires: 0, pending: 0 };
    fakeSave(acc);
    localStorage.setItem(FAKE_SESSION, phone);
    cloudSignUpQuiet(phone, nickname, password);
    return { ok: true, me: fakeMe(phone, acc[phone]), msg: "注册成功，免费试用 7 天已开启" };
  }

  async function changeName(name) {
    const e = nickError(name);
    if (e) return { ok: false, error: e };
    name = String(name).trim();
    if (isNative) return call("authChangeName", [name]);

    const phone = localStorage.getItem(FAKE_SESSION) || "";
    const acc = fakeAccounts();
    if (!phone || !acc[phone]) return { ok: false, error: "未登录" };
    acc[phone].name = name;
    fakeSave(acc);
    return { ok: true, name: name };
  }

  async function changePassword(oldPwd, newPwd) {
    const e = pwdError(newPwd);
    if (e) return { ok: false, error: e };
    if (isNative) return call("authChangePassword", [oldPwd, newPwd]);

    const phone = localStorage.getItem(FAKE_SESSION) || "";
    const acc = fakeAccounts();
    if (!phone || !acc[phone]) return { ok: false, error: "未登录" };
    if (acc[phone].hash !== fakeSha(oldPwd)) return { ok: false, error: "原密码错误" };
    acc[phone].hash = fakeSha(newPwd);
    fakeSave(acc);
    return { ok: true };
  }

  async function logout() {
    if (isNative) return call("authLogout", []);
    localStorage.removeItem(FAKE_SESSION);
    return { ok: true };
  }

  async function member() {
    if (isNative) {
      const r = await call("authMember", []);
      return r && r.ok ? r.member : null;
    }
    const phone = localStorage.getItem(FAKE_SESSION) || "";
    const acc = fakeAccounts()[phone];
    return acc ? fakeMember(acc) : null;
  }

  async function sendCode(phone) {
    phone = normPhone(phone);
    if (!phoneOK(phone)) return { ok: false, error: "请输入 11 位有效手机号" };
    if (isNative) return call("authSendCode", [phone]);

    const acc = fakeAccounts();
    if (!acc[phone]) return { ok: false, error: "该手机号还未注册，请先注册并设置密码" };
    const code = String(Math.floor(Math.random() * 1000000)).padStart(6, "0");
    sessionStorage.setItem("pyq_fake_code_" + phone, code);
    return { ok: true, devCode: code, ttl: 300, cooldown: 60 };
  }

  async function verifyCode(phone, code) {
    phone = normPhone(phone);
    code = String(code || "").replace(/\D/g, "");
    if (!phoneOK(phone)) return { ok: false, error: "请输入 11 位有效手机号" };
    if (code.length !== 6) return { ok: false, error: "请输入 6 位验证码" };
    if (isNative) return call("authVerifyCode", [phone, code]);

    const acc = fakeAccounts();
    if (!acc[phone]) return { ok: false, error: "该手机号还未注册，请先注册并设置密码" };
    const saved = sessionStorage.getItem("pyq_fake_code_" + phone) || "";
    if (!saved) return { ok: false, error: "请先获取验证码" };
    if (saved !== code) return { ok: false, error: "验证码不正确" };
    sessionStorage.removeItem("pyq_fake_code_" + phone);
    localStorage.setItem(FAKE_SESSION, phone);
    return { ok: true, me: fakeMe(phone, acc[phone]) };
  }

  async function purchase(tier) {
    if (isNative) return call("authPurchase", [tier]);
    const phone = localStorage.getItem(FAKE_SESSION) || "";
    const acc = fakeAccounts();
    if (!phone || !acc[phone]) return { ok: false, error: "未登录" };
    acc[phone].pending = tier;
    fakeSave(acc);
    return { ok: true, member: fakeMember(acc[phone]) };
  }

  /* 激活码：与原生 AuthBridge.genCode 保持一致（FNV-1a 32 位） */
  function genCode(phone, tier) {
    let h = 0x811c9dc5;
    const src = phone + "|" + tier + "|PYQ2026-VIP";
    for (let i = 0; i < src.length; i++) {
      h ^= src.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(16).toUpperCase().padStart(8, "0");
  }

  async function activate(code) {
    code = String(code || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (code.length !== 8) return { ok: false, error: "激活码为 8 位字符" };
    if (isNative) return call("authActivate", [code]);

    const phone = localStorage.getItem(FAKE_SESSION) || "";
    const acc = fakeAccounts();
    if (!phone || !acc[phone]) return { ok: false, error: "请先登录" };
    let hit = 0;
    for (let t = 1; t <= 4; t++) if (genCode(phone, t) === code) { hit = t; break; }
    if (!hit) return { ok: false, error: "激活码不正确，请核对后重试" };
    const now = Date.now();
    const cur = acc[phone];
    if (cur.tier === 4) return { ok: true, member: fakeMember(cur), msg: "当前已是永久会员" };
    const base = (cur.tier >= 1 && cur.expires > now) ? cur.expires : now;
    const days = (TIERS.find((t) => t.tier === hit) || {}).days || 0;
    cur.tier = hit;
    cur.expires = hit === 4 ? 0 : base + days * DAY;
    cur.pending = 0;
    fakeSave(acc);
    return { ok: true, member: fakeMember(cur), msg: hit === 4 ? "永久会员已开通" : ((TIERS.find((t) => t.tier === hit) || {}).name || "会员") + "已开通" };
  }

  async function genDevCode(phone, tier, pwd) {
    phone = normPhone(phone);
    if (!phoneOK(phone)) return { ok: false, error: "请输入 11 位有效手机号" };
    if (isNative) return call("authGenCode", [phone, tier, pwd]);
    if (pwd !== WX_ID) return { ok: false, error: "开发者密码错误" };
    return { ok: true, code: genCode(phone, tier), tierName: (TIERS.find((t) => t.tier === tier) || {}).name };
  }

  /* ---------------- 工具 ---------------- */

  function toast(msg) {
    const t = document.getElementById("toast");
    if (t) {
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._tm);
      toast._tm = setTimeout(() => t.classList.remove("show"), 2200);
    }
  }

  function strength(pwd) {
    const p = String(pwd || "");
    if (!p) return { score: 0, label: "未输入", color: "#C9CDD3" };
    if (p.length < 6) return { score: 1, label: "太短", color: "#FA5151" };
    let classes = 0;
    if (/[a-z]/.test(p)) classes++;
    if (/[A-Z]/.test(p)) classes++;
    if (/\d/.test(p)) classes++;
    if (/[^a-zA-Z0-9]/.test(p)) classes++;
    let s = 0;
    if (p.length >= 8) s++;
    if (p.length >= 12) s++;
    if (classes >= 2) s++;
    if (classes >= 3) s++;
    if (classes === 4 && p.length >= 8) s++;
    const score = Math.max(1, Math.min(4, s));
    const label = ["", "弱", "中", "强", "很强"][score];
    const color = ["", "#FA5151", "#FF9F43", "#07C160", "#059B4D"][score];
    return { score: score, label: label, color: color };
  }

  function copyText(text) {
    const done = () => toast("已复制：" + text);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      done();
    } catch (e) { toast("复制失败，请长按选择微信号"); }
  }

  function memberActive(m) {
    if (!m) return false;
    if (m.tier === 4) return true;
    const now = Date.now();
    if (m.tier >= 1 && m.expiresAt > now) return true;
    return m.trialEndsAt > now;
  }

  /* ---------------- 登录遮罩 ---------------- */

  let overlayRoot = null;
  let authMode = "pwd"; // pwd | code | reg
  let countdown = 0;
  let codeTimer = null;
  let lastDevCode = "";

  function ensureOverlay() {
    if (overlayRoot) return overlayRoot;
    overlayRoot = document.createElement("div");
    overlayRoot.id = "auth-overlay";
    document.body.appendChild(overlayRoot);
    return overlayRoot;
  }

  function removeOverlay() {
    if (overlayRoot && overlayRoot.parentNode) overlayRoot.parentNode.removeChild(overlayRoot);
    overlayRoot = null;
    countdown = 0;
    if (codeTimer) { clearInterval(codeTimer); codeTimer = null; }
  }

  function field(id, type, placeholder, extra) {
    return '<div class="auth-field"><input id="' + id + '" type="' + type + '" placeholder="' + placeholder + '" ' + (extra || "") + " /></div>";
  }

  function pwdStrengthHtml() {
    return (
      '<div class="pw-wrap">' +
        '<div class="pw-meter" id="pwMeter"><i></i><i></i><i></i><i></i></div>' +
        '<span class="pw-label" id="pwLabel">密码强度：未输入</span>' +
      "</div>" +
      '<div class="pw-tip">可自由组合数字、字母、符号，6-32 位</div>'
    );
  }

  function renderOverlay() {
    ensureOverlay();
    const isReg = authMode === "reg";
    const isCode = authMode === "code";
    let body = "";

    if (isReg) {
      body =
        field("authName", "text", "昵称（1-20 个字）", 'maxlength="20" autocomplete="nickname"') +
        field("authPhone", "tel", "手机号（11 位）", 'inputmode="numeric" maxlength="11" oninput="this.value=this.value.replace(/\\D/g,\'\')"') +
        '<div class="auth-field"><input id="authPwd" type="password" autocomplete="new-password" placeholder="设置登录密码" oninput="Auth.pwdInput(this.value)" /></div>' +
        pwdStrengthHtml() +
        field("authPwd2", "password", "再次输入密码", 'autocomplete="new-password"') +
        '<button class="auth-submit" onclick="Auth.submit()">注册并登录（免费试用 7 天）</button>' +
        '<div class="auth-foot">昵称可随时修改；注册后 7 天内免费使用全部功能</div>';
    } else if (isCode) {
      body =
        field("authPhone", "tel", "手机号（11 位）", 'inputmode="numeric" maxlength="11" oninput="this.value=this.value.replace(/\\D/g,\'\')"') +
        '<div class="auth-field auth-code-row">' +
          '<input id="authCode" type="tel" inputmode="numeric" maxlength="6" placeholder="6 位验证码" oninput="this.value=this.value.replace(/\\D/g,\'\')" />' +
          '<button class="auth-send" id="authSendBtn" onclick="Auth.sendSmsCode()">获取验证码</button>' +
        "</div>" +
        '<button class="auth-submit" onclick="Auth.submit()">验证码登录</button>' +
        '<div class="auth-foot">验证码 5 分钟内有效，仅已注册手机号可用</div>';
    } else {
      body =
        field("authPhone", "tel", "手机号（11 位）", 'inputmode="numeric" maxlength="11" oninput="this.value=this.value.replace(/\\D/g,\'\')"') +
        field("authPwd", "password", "登录密码", 'autocomplete="current-password"') +
        '<button class="auth-submit" onclick="Auth.submit()">登录</button>' +
        '<div class="auth-foot">还没有账号？点上方「注册」免费试用 7 天</div>';
    }

    overlayRoot.innerHTML =
      '<div class="auth-card">' +
        '<div class="auth-logo">朋友圈 AI 助手</div>' +
        '<div class="auth-sub">昵称 + 手机号注册登录 · 首次注册免费试用 7 天</div>' +
        '<div class="auth-tabs">' +
          '<button class="auth-tab ' + (authMode === "pwd" ? "active" : "") + '" onclick="Auth.setMode(\'pwd\')">密码登录</button>' +
          '<button class="auth-tab ' + (authMode === "code" ? "active" : "") + '" onclick="Auth.setMode(\'code\')">验证码登录</button>' +
          '<button class="auth-tab ' + (isReg ? "active" : "") + '" onclick="Auth.setMode(\'reg\')">注册</button>' +
        "</div>" +
        body +
        '<div class="auth-hint" id="authHint"></div>' +
      "</div>";

    if (lastDevCode && isCode) {
      const h = document.getElementById("authHint");
      if (h) { h.className = "auth-hint dev"; h.textContent = "演示验证码：" + lastDevCode + "（点这里自动填入）"; h.onclick = () => { const c = document.getElementById("authCode"); if (c) c.value = lastDevCode; }; }
    }
    const p = document.getElementById("authPhone");
    if (p) setTimeout(() => p.focus(), 80);
  }

  function setMode(m) {
    authMode = m;
    lastDevCode = "";
    renderOverlay();
  }

  function pwdInput(v) {
    const s = strength(v);
    const meter = document.getElementById("pwMeter");
    const label = document.getElementById("pwLabel");
    if (meter) {
      const bars = meter.querySelectorAll("i");
      bars.forEach((b, i) => {
        b.style.background = i < s.score ? s.color : "#E8EAEE";
      });
    }
    if (label) {
      label.textContent = "密码强度：" + s.label;
      label.style.color = s.color;
    }
  }

  async function sendSmsCode() {
    const phone = normPhone((document.getElementById("authPhone") || {}).value || "");
    const hint = document.getElementById("authHint");
    if (!phoneOK(phone)) { setHint("请输入 11 位有效手机号"); return; }
    if (countdown > 0) return;
    const r = await sendCode(phone);
    if (!r || !r.ok) { setHint((r && r.error) || "验证码发送失败"); return; }
    lastDevCode = r.devCode || "";
    setHint(r.devCode ? "演示验证码：" + r.devCode + "（未接入短信网关，点提示自动填入）" : "验证码已发送", "dev");
    const hintEl = document.getElementById("authHint");
    if (hintEl && r.devCode) hintEl.onclick = () => { const c = document.getElementById("authCode"); if (c) c.value = r.devCode; };
    startCountdown(r.cooldown || 60);
  }

  function startCountdown(sec) {
    countdown = sec;
    const btn = document.getElementById("authSendBtn");
    if (!btn) return;
    btn.disabled = true;
    btn.textContent = countdown + "s 后重发";
    if (codeTimer) clearInterval(codeTimer);
    codeTimer = setInterval(() => {
      countdown--;
      const b = document.getElementById("authSendBtn");
      if (!b) { clearInterval(codeTimer); codeTimer = null; return; }
      if (countdown <= 0) {
        clearInterval(codeTimer);
        codeTimer = null;
        b.disabled = false;
        b.textContent = "获取验证码";
      } else {
        b.textContent = countdown + "s 后重发";
      }
    }, 1000);
  }

  function setHint(msg, cls) {
    const h = document.getElementById("authHint");
    if (!h) return;
    h.className = "auth-hint" + (cls ? " " + cls : "");
    h.textContent = msg;
    h.onclick = null;
  }

  async function submit() {
    const phone = normPhone((document.getElementById("authPhone") || {}).value || "");
    const hint = document.getElementById("authHint");
    setHint("");

    if (authMode === "code") {
      const code = (document.getElementById("authCode") || {}).value || "";
      if (code.replace(/\D/g, "").length !== 6) { setHint("请输入 6 位验证码"); return; }
      const r = await verifyCode(phone, code);
      if (r && r.ok) onLoginOk(r);
      else setHint((r && r.error) || "登录失败");
      return;
    }

    const pwd = (document.getElementById("authPwd") || {}).value || "";
    if (!phoneOK(phone)) { setHint("请输入 11 位有效手机号"); return; }
    const pe = pwdError(pwd);
    if (pe) { setHint(pe); return; }

    if (authMode === "reg") {
      const nickname = (document.getElementById("authName") || {}).value || "";
      const ne = nickError(nickname);
      if (ne) { setHint(ne); return; }
      const p2 = (document.getElementById("authPwd2") || {}).value || "";
      if (pwd !== p2) { setHint("两次输入的密码不一致"); return; }
      const r = await register(phone, nickname, pwd);
      if (r && r.ok) onLoginOk(r);
      else setHint((r && r.error) || "注册失败");
      return;
    }

    const r = await login(phone, pwd);
    if (r && r.ok) onLoginOk(r);
    else setHint((r && r.error) || "登录失败");
  }

  function onLoginOk(r) {
    removeOverlay();
    Auth.current = r.me || null;
    toast(r.msg || "登录成功");
    window.__authChanged && window.__authChanged(Auth.current);
    if (!memberActive(Auth.current && Auth.current.member)) showLock();
    else hideVip();
  }

  /* ---------------- 会员：到期锁定 / 付费 ---------------- */

  let vipRoot = null;
  let vipView = "tiers";       // tiers | pay | code | contact | dev
  let vipLocked = true;
  let selectedTier = 1;

  function ensureVip() {
    if (vipRoot) return vipRoot;
    vipRoot = document.createElement("div");
    vipRoot.id = "vip-overlay";
    document.body.appendChild(vipRoot);
    return vipRoot;
  }

  function hideVip() {
    if (vipRoot && vipRoot.parentNode) vipRoot.parentNode.removeChild(vipRoot);
    vipRoot = null;
  }

  function showLock() {
    vipLocked = true;
    vipView = "tiers";
    renderVip();
  }

  function showPay(tier) {
    vipLocked = false;
    vipView = "pay";
    selectedTier = tier || 1;
    renderVip();
    purchase(selectedTier);
  }

  function vipViewChange(v) {
    if (v === "close") { closeVip(); return; }
    vipView = v;
    renderVip();

  function currentMember() {
    return (Auth.current && Auth.current.member) || {};
  }

  function statusText(m) {
    if (m.tier === 4) return "永久会员 · 无限期使用";
    if (m.tier >= 1 && m.expiresAt > Date.now()) return m.tierName + " · 剩余 " + m.daysLeft + " 天";
    if (m.trialEndsAt > Date.now()) return "免费试用 · 剩余 " + m.daysLeft + " 天";
    return "免费试用已结束";
  }

  function tierCards(selected) {
    return TIERS.map((t) => {
      const on = t.tier === selected;
      return (
        '<div class="tier-card' + (on ? " active" : "") + '" onclick="Auth.selectTier(' + t.tier + ')">' +
          '<div class="tier-name">' + t.name + '<span class="tier-tag">' + t.tag + "</span></div>" +
          '<div class="tier-price"><b>¥' + t.price + "</b><span>" + (t.days ? t.days + " 天" : "永久") + "</span></div>" +
        "</div>"
      );
    }).join("");
  }

  function renderVip() {
    ensureVip();
    const m = currentMember();
    const t = TIERS.find((x) => x.tier === selectedTier) || TIERS[0];
    let inner = "";

    if (vipView === "pay") {
      inner =
        '<div class="vip-card">' +
          '<div class="pay-top">' +
            '<button class="pay-back" onclick="Auth.vipView(\'' + (vipLocked ? "tiers" : "close") + '\')">' + (vipLocked ? "←" : "✕") + "</button>" +
            "<b>开通" + t.name + "</b>" +

  function selectTier(tier) {
    selectedTier = tier;
    renderVip();
  }

  function paySelected() {
    vipView = "pay";
    renderVip();
    purchase(selectedTier);
  }

  function closeVip() {
    if (vipLocked) return;
    hideVip();
  }

  function copyWx() { copyText(WX_ID); }

  async function submitActivate() {
    const code = (document.getElementById("vipCode") || {}).value || "";
    const h = document.getElementById("vipHint");
    if (code.replace(/[^A-Za-z0-9]/g, "").length !== 8) {
      if (h) { h.className = "auth-hint"; h.textContent = "请输入 8 位激活码"; }
      return;
    }
    const r = await activate(code);
    if (r && r.ok) {
      if (Auth.current) Auth.current.member = r.member || currentMember();
      hideVip();
      toast(r.msg || "会员已开通");
      window.__authChanged && window.__authChanged(Auth.current);
    } else if (h) {
      h.className = "auth-hint";
      h.textContent = (r && r.error) || "激活失败";
    }
  }

  async function devGenTap() {
    const phone = normPhone((document.getElementById("devPhone") || {}).value || "");
    const tier = parseInt((document.getElementById("devTier") || {}).value || "1", 10);
    const pwd = (document.getElementById("devPwd") || {}).value || "";
    const out = document.getElementById("devOut");
    const r = await genDevCode(phone, tier, pwd);
    if (out) {
      out.className = "auth-hint " + (r && r.ok ? "dev" : "");
      out.textContent = r && r.ok ? "激活码：" + r.code + "（" + r.tierName + "）" : ((r && r.error) || "生成失败");
    }
  }

  function logoutTap() {
    if (window.App && App.logout) App.logout();
    else logout().then(() => show());
  }

  function openDevTool() {
    vipLocked = false;
    vipView = "dev";
    renderVip();
  }

  /* ---------------- 启动校验 ---------------- */

  function show() {
    authMode = "pwd";
    lastDevCode = "";
    renderOverlay();
  }

  function gate(me) {
    me = me || Auth.current;
    if (!me) { show(); return; }
    if (!memberActive(me.member)) showLock();
    else hideVip();
  }

  function bindBack(activity) {
    const old = activity.nativeBack;
    activity.nativeBack = function () {
      if (document.getElementById("auth-overlay")) return "sheet";
      if (document.getElementById("vip-overlay")) return "sheet";
      return old();
    };
  }

  window.__nativeResolve = (id, payload) => resolveCallback(id, payload);

  // 试用到期实时锁定：每分钟检查一次
  setInterval(() => {
    if (Auth.current && !memberActive(Auth.current.member) && !document.getElementById("vip-overlay")) {
      showLock();
    }
  }, 60000);

  const Auth = {
    available: () => true,
    current: null,
    isNative: () => isNative,
    isNativeOnly: () => isNative,
    getMe, login, register, changePassword, changeName, logout, member,
    sendCode, verifyCode, purchase, activate, genDevCode,
    gate, show, setMode, submit, pwdInput, sendSmsCode, strength,
    showLock, hideVip, showPay, vipView: vipViewChange, selectTier, paySelected,
    closeVip, copyWx, submitActivate, devGenTap, openDevTool, logoutTap,
    bindBack,
    tiers: TIERS,
    wxId: WX_ID,
    memberActive
  };
  window.Auth = Auth;
})();

<script>
/* app.js */
/* 应用主控：导航、动作、云盘同步 */
(function () {
  const { store, ui, save, nowISO, todayKey, uid, escapeHtml } = Core;
  const icon = UI.icon;
  const SYNC_KEY = "pyq_sync_v1";
  const TABS = { home: "home", create: "create", topics: "topics", materials: "materials", more: "more" };
  const TAB_OF = { schedule: "more", profile: "more", history: "more", compliance: "more", sync: "more", account: "more", member: "more", contact: "more", update: "more" };
  let stack = [];

  const RENDERERS = {
    home: ViewsHome.renderHome,
    create: ViewsHome.renderCreate,
    compose: ViewsCompose.renderCompose,
    topics: ViewsLibrary.renderTopics,
    materials: ViewsLibrary.renderMaterials,
    schedule: ViewsMore.renderSchedule,
    profile: ViewsMore.renderProfile,
    history: ViewsMore.renderHistory,
    compliance: ViewsMore.renderCompliance,
    sync: ViewsMore.renderSync,
    account: ViewsMore.renderAccount,
    member: ViewsMore.renderMember,
    contact: ViewsMore.renderContact,
    update: ViewsMore.renderUpdate,
    more: ViewsMore.renderMore
  };

  function render(scrollTop) {
    const view = document.getElementById("view");
    const y = view ? view.scrollTop : 0;
    const html = (RENDERERS[ui.page] || RENDERERS.home)();
    view.innerHTML = html;
    const active = TAB_OF[ui.page] || ui.page;
    document.querySelectorAll(".tab").forEach((b) => {
      b.classList.toggle("active", b.dataset.tab === active);
    });
    if (scrollTop) view.scrollTop = 0;
    else view.scrollTop = y;
  }

  function tab(page) {
    ui.page = page;
    stack = [page];
    render(true);
  }

  function go(page) {
    if (ui.page !== page) stack.push(ui.page);
    ui.page = page;
    render(true);
  }

  function back() {
    const prev = stack.pop();
    ui.page = prev || "home";
    render(true);
  }

  /* ---------- 提示 ---------- */
  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
  }

  /* ---------- 底部弹层 ---------- */
  const sheetRoot = () => document.getElementById("sheet-root");
  function openSheet(html) {
    sheetRoot().innerHTML =
      '<div class="sheet-mask" onclick="if(event.target===this)App.closeSheet()"><div class="sheet"><div class="sheet-handle"></div>' + html + "</div></div>";
  }
  function closeSheet() { sheetRoot().innerHTML = ""; }

  /* ---------- 文案创作 ---------- */
  function pickType(id) {
    const t = Core.typeById(id);
    ui.compose = {
      typeId: id, mode: "ai", size: "short", topic: Core.topicFor(id), styles: [], materialIds: [],
      text: "", result: "", check: null, variant: 0, replaced: false,
      fixedText: "", loading: false, blockId: "", slotId: "", histId: ""
    };
    go("compose");
  }

  function ensureCompose() {
    if (!ui.compose) pickType(store.types[0].id);
    return ui.compose;
  }

  function setMode(mode) {
    const c = ensureCompose();
    c.mode = mode;
    if (mode === "free" && !c.text) c.text = c.result || "";
    c.check = null; c.replaced = false; c.result = "";
    render();
  }

  // 篇幅：短文 / 长文，切换后清空上一次结果，避免篇幅与结果不一致
  function setSize(size) {
    const c = ensureCompose();
    if (c.size === size) return;
    c.size = size;
    c.result = "";
    c.check = null;
    c.replaced = false;
    c.fixedText = "";
    if (c.mode === "ai") c.text = "";
    render();
  }

  function setTopic(v) { ensureCompose().topic = v; }
  function setDraftText(v) {
    const c = ensureCompose();
    c.text = v;
    const el = document.getElementById("charCount");
    if (el) el.textContent = [...v].length + " 字 · " + (c.size === "long" ? "目标 300+" : "目标 ≤ " + Core.SHORT_MAX);
  }

  function toggleStyle(id) {
    const c = ensureCompose();
    const i = c.styles.indexOf(id);
    if (i >= 0) c.styles.splice(i, 1); else c.styles.push(id);
    render();
  }

  function toggleMaterial(id) {
    const c = ensureCompose();
    const i = c.materialIds.indexOf(id);
    if (i >= 0) c.materialIds.splice(i, 1); else c.materialIds.push(id);
    render();
  }

  function generate() {
    const c = ensureCompose();
    c.loading = true;
    c.replaced = false;
    render();
    setTimeout(() => {
      c.variant += 1;
      let text = Core.generate(c.typeId, c.topic, c.variant, c.styles, c.materialIds, c.size);
      c.result = text;
      c.text = text;
      c.check = Core.checkText(text);
      c.fixedText = c.check.passed ? "" : Core.replaceText(text, c.check.violations);
      c.loading = false;
      if (!c.check.passed) recordBlock(c); else recordPass(c);
      render();
      const view = document.getElementById("view");
      const res = view.querySelector(".result");
      if (res) view.scrollTop = view.scrollHeight;
    }, 720);
  }

  function polish() {
    const c = ensureCompose();
    if (!c.text.trim()) { toast("先写下你的原文"); return; }
    c.loading = true;
    render();
    setTimeout(() => {
      c.variant += 1;
      let text = Core.polish(c.text, c.size);
      text = Core.applyStyles(text, c.styles);
      c.result = text;
      c.check = Core.checkText(text);
      c.fixedText = c.check.passed ? "" : Core.replaceText(text, c.check.violations);
      c.loading = false;
      if (!c.check.passed) recordBlock(c); else recordPass(c);
      render();
      const view = document.getElementById("view");
      view.scrollTop = view.scrollHeight;
    }, 620);
  }

  function recordPass(c) {
    const t = Core.typeById(c.typeId);
    if (c.histId) {
      const h = store.history.find((x) => x.id === c.histId);
      if (h) {
        h.title = c.topic || h.title;
        h.text = c.result;
        h.time = nowISO();
        h.status = "已通过";
        save();
        return;
      }
    }
    const item = {
      id: uid("h"), type: c.typeId, typeName: t ? t.name : "",
      mode: c.mode === "ai" ? "AI 生成" : "自由创作",
      title: c.topic || (t ? t.defaultTopic : ""), text: c.result, time: nowISO(), status: "已通过"
    };
    store.history.unshift(item);
    c.histId = item.id;
    save();
  }

  function recordBlock(c) {
    const t = Core.typeById(c.typeId);
    const cats = [...new Set(c.check.violations.map((v) => v.category))].join("、");
    const words = [...new Set(c.check.violations.map((v) => v.word))].join(" / ");
    const replaced = c.fixedText || Core.replaceText(c.result, c.check.violations);
    if (c.blockId) {
      const b = store.blocks.find((x) => x.id === c.blockId);
      if (b) { b.original = c.result; b.replaced = replaced; b.word = words; b.category = cats; }
    } else {
      c.blockId = uid("b");
      store.blocks.unshift({
        id: c.blockId, word: words, category: cats,
        reason: "命中 " + cats + " 风险词，已强制拦截，未替换前不可复制 / 保存 / 发布。",
        original: c.result, replaced: replaced, time: nowISO(),
        source: (t ? t.name : "") + " · " + (c.mode === "ai" ? "AI 生成" : "自由创作")
      });
      const hid = uid("h");
      c.histId = hid;
      store.history.unshift({
        id: hid, type: c.typeId, typeName: t ? t.name : "", mode: c.mode === "ai" ? "AI 生成" : "自由创作",
        title: c.topic, text: c.result, time: nowISO(), status: "已拦截"
      });
    }
    save();
    queueHistory(c);
  }

  function applyFix() {
    const c = ensureCompose();
    if (!c.check || c.check.passed) return;
    const fixed = Core.replaceText(c.result, c.check.violations);
    const recheck = Core.checkText(fixed);
    c.fixedText = fixed;
    c.result = fixed;
    c.text = fixed;
    c.check = recheck;
    c.replaced = true;
    const b = store.blocks.find((x) => x.id === c.blockId);
    if (b) b.replaced = fixed;
    save();
    toast(recheck.passed ? "已替换为合规版本" : "替换后仍有风险，请再改一改");
    render();
  }

  function copy() {

  /* 加入排期：先选发布时间段，再写入当日排期 */
  function addToSchedule() {
    const c = ensureCompose();
    if (!c.result || !c.check || !c.check.passed) { toast("合规通过后才能加入排期"); return; }
    const rows = store.slots.map((s) => {
      const item = (store.schedule || []).find((x) => x.slotId === s.id) || {};
      const busy = !!(item.text || item.topicId);
      const label = busy
        ? "已排：" + (item.topicId ? (Core.topicById(item.topicId) || {}).title || item.text : item.text)
        : "空闲";
      const mine = c.slotId === s.id;
      return (
        '<div class="slot-pick' + (mine ? " active" : "") + '" onclick="App.commitSchedule(\'' + s.id + '\')">' +
          '<div><b>' + s.time + '</b><span>' + s.level + "档 · " + s.title + "</span></div>" +
          '<em class="' + (busy ? "busy" : "") + '">' + escapeHtml(label) + "</em>" +
        "</div>"
      );
    }).join("");
    openSheet(
      "<h3>选择发布时间段</h3>" +
      '<div class="muted" style="margin:6px 0 12px">选一个时段加入今日排期，已有内容的时段会被这条替换。</div>' +
      rows +
      '<div class="sheet-actions"><button class="btn ghost" onclick="App.closeSheet()">取消</button></div>'
    );
  }

  function commitSchedule(slotId) {
    const slot = store.slots.find((s) => s.id === slotId);
    if (!slot) return;
    const cur = (store.schedule || []).find((x) => x.slotId === slotId);
    const busyText = cur ? (cur.topicId ? ((Core.topicById(cur.topicId) || {}).title || "") : cur.text || "") : "";
    if (busyText) {
      openSheet(
        "<h3>该时段已有内容</h3>" +
        '<div class="muted" style="margin:6px 0 12px">' + slot.time + " 当前是「" + escapeHtml(busyText.slice(0, 20)) +
          "」。替换后原内容会移出排期（选题仍在选题库，不会删除）。</div>" +
        '<div class="sheet-actions">' +
          '<button class="btn ghost" onclick="App.closeSheet()">取消</button>' +
          '<button class="btn primary" onclick="App.doCommitSchedule(\'' + slotId + '\')">确认替换</button>' +
        "</div>"
      );
      return;
    }
    doCommitSchedule(slotId);
  }

  function doCommitSchedule(slotId) {
    const c = ensureCompose();
    const slot = store.slots.find((s) => s.id === slotId);
    if (!slot) return;
    let item = (store.schedule || []).find((x) => x.slotId === slotId);
    if (!item) {
      item = { slotId: slotId, topicId: "", status: "待排", type: c.typeId, text: "", time: slot.time.split("-")[0] };
      store.schedule.push(item);
    }
    item.type = c.typeId;
    item.topicId = "";
    item.status = "待发布";
    item.text = c.result.replace(/\n/g, " ").slice(0, 40);
    c.slotId = slotId;
    save();
    queueSchedule();
    closeSheet();
    render();
    toast("已加入 " + slot.time + " 排期");
  }

  /* 选题 ↔ 时间段：自由调整某条选题在哪个时段发布 */
  function openSlotPicker(topicId) {
    const tp = Core.topicById(topicId);
    if (!tp) return;
    const current = (store.schedule || []).find((x) => x.topicId === topicId);
    const rows = store.slots.map((s) => {
      const item = (store.schedule || []).find((x) => x.slotId === s.id) || {};
      let note = "空闲";
      if (item.topicId && item.topicId !== topicId) {
        const other = Core.topicById(item.topicId);
        note = "已排：" + (other ? other.title : item.text);
      } else if (item.topicId === topicId) {
        note = "当前安排";
      } else if (item.text) {
        note = "已排：" + item.text;
      }
      const mine = current && current.slotId === s.id;
      return (
        '<div class="slot-pick' + (mine ? " active" : "") + '" onclick="App.assignTopic(\'' + topicId + "','" + s.id + '\')">' +
          '<div><b>' + s.time + '</b><span>' + s.level + "档 · " + s.title + "</span></div>" +
          '<em class="' + (note === "空闲" || mine ? "" : "busy") + '">' + escapeHtml(note) + "</em>" +
        "</div>"
      );
    }).join("");
    openSheet(
      "<h3>安排发布时间段</h3>" +
      '<div class="muted" style="margin:6px 0 12px">' + escapeHtml(tp.title) + " · 已有选题的时段会自动换位，不会丢内容。</div>" +
      rows +
      '<div class="sheet-actions">' +
        (current ? '<button class="btn ghost" onclick="App.clearSlot(\'' + current.slotId + '\')">移出排期</button>' : "") +
        '<button class="btn ghost" onclick="App.closeSheet()">取消</button></div>'
    );
  }

  function assignTopic(topicId, slotId) {
    const tp = Core.topicById(topicId);
    const slot = store.slots.find((s) => s.id === slotId);
    if (!tp || !slot) return;
    const list = store.schedule || [];
    const prev = list.find((x) => x.topicId === topicId && x.slotId !== slotId) || null;
    let target = list.find((x) => x.slotId === slotId);
    if (!target) {
      target = { slotId: slotId, topicId: "", status: "待排", type: "", text: "", time: slot.time.split("-")[0] };
      list.push(target);
    }
    const otherId = target.topicId && target.topicId !== topicId ? target.topicId : "";
    const other = otherId ? Core.topicById(otherId) : null;

    // 该选题先离开原时段
    if (prev) { prev.topicId = ""; prev.text = ""; prev.type = ""; prev.status = "待排"; }
    // 目标时段原有的另一条选题换回原时段（真正互换，内容不丢）
    if (otherId) {
      if (prev) {
        prev.topicId = otherId;
        prev.type = other ? other.type : target.type;
        prev.text = other ? other.title : target.text;
        prev.status = "待排";
      } else {
        target.topicId = "";
        target.text = "";
      }
    }
    target.topicId = topicId;
    target.type = tp.type;
    target.text = tp.title;
    target.status = "待排";
    save();
    queueSchedule();
    closeSheet();
    render();
    toast("已安排到 " + slot.time + (other && prev ? "，与「" + other.title.slice(0, 8) + "…」互换" : other ? "，「" + other.title.slice(0, 8) + "…」已移出排期" : ""));
  }

  function clearSlot(slotId) {
    const item = (store.schedule || []).find((x) => x.slotId === slotId);
    if (!item) return;
    item.topicId = "";
    item.text = "";

  function saveCopyFiles() {
    if (!copyUploadFiles.length) { toast("先选择要上传的文案文件"); return; }
    const type = document.getElementById("copyUpType").value;
    const files = copyUploadFiles.slice();
    copyUploadFiles = [];
    const readers = files.map((f) => new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve({ name: f.name, text: String(r.result || "") });
      r.onerror = () => resolve({ name: f.name, text: "" });
      r.readAsText(f, "utf-8");
    }));
    toast("正在读取 " + files.length + " 个文件…");
    Promise.all(readers).then((arr) => {
      let ok = 0;
      arr.forEach((item) => {
        const text = (item.text || "").trim().slice(0, 5000);
        if (!text) return;
        const id = uid("m");
        store.materials.copy.unshift({
          id: id, type: type, category: type, text: text,

        queueItem("素材库/文案库/" + type, id + "_" + (item.name || "文案.txt"), text);

      if (!ok) { toast("文件为空或格式不支持"); return; }
      save();
      syncNow();
      closeSheet();
      ui.materialCat = type;
      render();
      toast("已上传 " + ok + " 条「" + type + "」文案并同步云盘");
    });
  }

  /* ---------- 素材上传 ---------- */
  const IMG_SOURCE_LIMIT = 30 * 1024 * 1024;   // 原图上限 30MB
  const VIDEO_LIMIT = 300 * 1024 * 1024;       // 视频上限 300MB
  // 本次打开期间可播放的本地视频临时地址（刷新后失效，文件已存相册）
  const videoPreviewUrls = {};

  // 独立 App 且未配置服务器：素材保存到手机本地而不是飞书云盘
  function nativeLocal() {
    return !!(window.NativeApp && NativeApp.available() && !NativeApp.hasServer());
  }

  // 用 canvas 压缩图片，避免手机大图撑爆 localStorage
  function compressImage(file, maxEdge, quality) {
    return new Promise((resolve, reject) => {
      const mime = (file.type || "").toLowerCase();
      // 浏览器无法解码 HEIC/HEIF 等格式，直接返回原文件做上传用
      if (mime && !mime.startsWith("image/") || mime === "image/heic" || mime === "image/heif") {
        reject(new Error("unsupported"));
        return;
      }
      const url = URL.createObjectURL(file);
      const img = new Image();
      let done = false;
      const finish = (fn) => { if (!done) { done = true; URL.revokeObjectURL(url); fn(); } };
      const timer = setTimeout(() => finish(() => reject(new Error("图片处理超时"))), 15000);
      img.onload = () => {
        clearTimeout(timer);
        try {
          const w0 = img.naturalWidth || img.width;
          const h0 = img.naturalHeight || img.height;
          if (!w0 || !h0) throw new Error("图片尺寸无效");
          const scale = Math.min(1, maxEdge / Math.max(w0, h0));
          const w = Math.max(1, Math.round(w0 * scale));
          const h = Math.max(1, Math.round(h0 * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          const src = canvas.toDataURL("image/jpeg", quality);
          finish(() => resolve(src));
        } catch (e) {
          finish(() => reject(e));
        }
      };
      img.onerror = () => { clearTimeout(timer); finish(() => reject(new Error("unsupported"))); };
      img.src = url;
    });
  }

  // 将 File 直接转成 data URL（用于不支持 canvas 解码的图片格式，如 HEIC）
  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error("文件读取失败"));
      reader.readAsDataURL(file);
    });
  }

  function dataUrlToBlob(dataUrl) {
    const parts = String(dataUrl).split(",");
    const meta = parts[0] || "";
    const mime = (meta.match(/:(.*?);/) || [])[1] || "application/octet-stream";
    const bin = atob(parts[1] || "");
    const arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: mime });
  }

  // 二进制直传：服务端流式落盘后用 lark-cli 上传，大文件不占用页面内存与本地存储
  function uploadBinary(folder, name, blob, onProgress) {
    // 独立 App：由原生层保存到手机相册或转发到自定义服务器
    if (window.NativeApp && NativeApp.available()) {
      return NativeApp.upload(folder, name, blob, onProgress);
    }
    return new Promise((resolve) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/api/upload?folder=" + encodeURIComponent(folder) + "&name=" + encodeURIComponent(name));
      xhr.setRequestHeader("Content-Type", "application/octet-stream");
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable && onProgress) onProgress(Math.min(99, Math.round((e.loaded / e.total) * 100)));
      };
      xhr.onload = () => {
        let d = {};
        try { d = JSON.parse(xhr.responseText || "{}"); } catch (e) { d = { ok: false, error: "返回解析失败" }; }
        if (!d.ok && !d.error) d.error = "上传失败（HTTP " + xhr.status + "）";
        resolve(d);
      };
      xhr.onerror = () => resolve({ ok: false, error: "网络异常，请确认本地服务已启动" });
      xhr.send(blob);
    });
  }

  async function uploadImages(input) {
    const files = Array.prototype.slice.call(input.files || []);
    input.value = "";
    if (!files.length) return;
    const big = files.filter((f) => f.size > IMG_SOURCE_LIMIT);
    const list = files.filter((f) => f.size <= IMG_SOURCE_LIMIT);
    if (big.length) toast(big.length + " 张图片超过 30MB，已跳过");
    if (!list.length) return;

    let done = 0;
    for (let i = 0; i < list.length; i++) {
      const file = list[i];
      toast("正在处理图片 " + (i + 1) + "/" + list.length + "…");
      let src, thumb, uploadBlob, ext = "jpg";
      try {
        src = await compressImage(file, 1280, 0.82);
        thumb = await compressImage(file, 480, 0.6);
        uploadBlob = dataUrlToBlob(src);
      } catch (e) {
        // canvas 无法解码（如 iPhone HEIC），直接用原文件上传
        if (e.message === "unsupported") {
          try {
            src = await fileToDataURL(file);
            thumb = src;
            uploadBlob = file;
            ext = (file.name.split(".").pop() || "jpg").toLowerCase();
          } catch (e2) {
            toast("「" + file.name + "」处理失败：" + (e2.message || "无法读取"));
            continue;
          }
        } else {
          toast("「" + file.name + "」处理失败：" + (e.message || "无法读取"));
          continue;
        }
      }
      const m = {
        id: uid("img"), source: "图片上传", prompt: file.name, src: src, time: nowISO(),
        size: Math.round(file.size / 1024), synced: false, url: ""
      };
      store.materials.images.unshift(m);
      if (!save()) {
        m.src = thumb;
        if (!save()) {
          store.materials.images = store.materials.images.filter((x) => x.id !== m.id);
          toast("本地存储已满，请先删除部分图片再上传");
          break;
        }
      }
      render();
      const safe = (file.name || "image").replace(/[\\/:*?"<>|]/g, "").replace(/\.[^.]+$/, "") || "image";
      const d = await uploadBinary(
        "素材库/图片库/图片上传",
        m.id + "_" + safe + "." + ext,
        uploadBlob,
        (p) => toast("图片 " + (i + 1) + "/" + list.length + " 上传中 " + p + "%")
      );
      if (d && d.ok) {
        m.synced = true;
        m.url = d.url || "";
        delete m.error;
        done++;
        save();
      } else {
        m.error = (d && d.error) || "上传失败";
        save();
      }
      render();
    }
    if (done) toast(nativeLocal() ? "已保存 " + done + " 张图片到手机相册" : "已上传 " + done + " 张图片到云盘图片库");
    else toast("图片已存入素材库，保存失败：" + (store.materials.images[0] && store.materials.images[0].error || "请重试"));
  }

  function removeImage(id) {

  }

      m.error = (d && d.error) || "上传失败";
      toast("重试失败：" + m.error);
    }
    save();
    render();
  }

  async function saveVideo() {
    const title = document.getElementById("videoTitle").value.trim();
    const source = document.getElementById("videoSource").value;
    const url = document.getElementById("videoUrl").value.trim();
    if (!title) { toast("写个标题再保存"); return; }

    const check = Core.checkText(title);
    if (!check.passed) {
      const info = blockInfo(check);
      recordMedia({
        kind: "video", status: "已拦截", title: title, source: source,
        category: info.category, word: info.word,
        reason: info.reason + "，视频标题未通过检测，已拦截未保存"
      });
      pendingVideoFile = null;
      closeSheet(); render();
      toast("标题含风险词，已拦截并记入生成记录");
      return;
    }

    const v = {
      id: uid("v"), kind: "video", title: title, source: source, url: url,
      time: nowISO(), size: 0, synced: false, local: false, error: ""
    };
    store.materials.videos.unshift(v);
    save();
    closeSheet();
    render();

    if (pendingVideoFile) {
      const file = pendingVideoFile;
      pendingVideoFile = null;
      v.local = true;
      v.size = Math.round(file.size / 1024);
      videoPreviewUrls[v.id] = URL.createObjectURL(file);
      render();
      const safe = (file.name || "video").replace(/[\\/:*?"<>|]/g, "");
      const d = await uploadBinary(
        "素材库/视频库/本地视频", v.id + "_" + safe, file,
        (p) => toast("视频保存中 " + p + "%")
      );
      if (d && d.ok) { v.synced = true; v.url = d.url || ""; delete v.error; }
      else { v.error = (d && d.error) || "保存失败"; }
      save();
      render();
      if (v.synced) {
        recordMedia({
          kind: "video", status: "已通过", title: title, source: source,
          media: { url: v.url, local: true }
        });
        toast("视频已保存到手机相册，可点卡片播放");
      } else {
        toast("记录已保存，文件保存失败：" + (v.error || "请重试"));
      }
      return;
    }

    recordMedia({
      kind: "video", status: "已通过", title: title, source: source,
      media: { url: url, local: false }
    });
    toast(url ? "视频素材已保存，可点卡片播放" : "视频记录已保存（未提供视频文件）");
  }

    let done = 0;
    for (let i = 0; i < list.length; i++) {

  function onAvatarFile(input) {
    const f = input.files && input.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) return toast("请选择图片文件");
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const size = 200;
        const c = document.createElement("canvas");
        c.width = size; c.height = size;
        const ctx = c.getContext("2d");
        const s = Math.min(img.width, img.height) || 1;
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        try {
          store.user.avatar = c.toDataURL("image/jpeg", 0.86);
        } catch (e) {
          return toast("头像处理失败");
        }
        Core.saveProfile();
        render(); toast("头像已更新");
      };
      img.onerror = () => toast("图片读取失败");
      img.src = String(fr.result || "");
    };
    fr.onerror = () => toast("图片读取失败");
    fr.readAsDataURL(f);
  }

    store.blocks.forEach((b) => items.push({ folder: "历史生成记录", name: "拦截记录_" + b.id + ".txt", content: "违规原因：" + b.reason + "\n违规内容：" + b.original + "\n替换内容：" + b.replaced + "\n时间：" + b.time }));
    items.push({ folder: "发布时间排期", name: "每日发布排期表.txt", content: scheduleText() });
    items.push({ folder: "合规检测", name: "合规词库与规则.txt", content: wordsText() });
    return items;
  }

  async function flushSync() {
    if (!ui.sync.pending.length || ui.sync.state === "busy") return;
    ui.sync.state = "busy";
    if (ui.page === "sync") render();
    try {
      if (!(window.NativeApp && NativeApp.available())) {
        ui.sync.state = "error";
        ui.sync.error = "本地归档只在 App 内可用，网页版无法写入手机存储。";
        persistSync();
        if (ui.page === "sync") render();
        return;
      }
      const nac = await NativeApp.sync(ui.sync.pending);
      if (!nac || !nac.ok) throw new Error((nac && nac.error) || "归档失败");
      ui.sync.pending = [];
      ui.sync.state = "ok";
      ui.sync.last = nowISO();
      ui.sync.synced = nac.synced || 0;
      ui.sync.error = "";
      toast("已归档 " + (nac.synced || 0) + " 个文件到本机");
    } catch (e) {
      ui.sync.state = "error";
      ui.sync.error = "归档失败：" + ((e && e.message) || "未知错误") + "，内容会留在待归档队列，可稍后重试。";
    }
    persistSync();
    if (ui.page === "sync") render();
  }

  async function syncNow() {
    if (ui.sync.state === "busy") return;
    if (!ui.sync.pending.length) ui.sync.pending = buildAllItems();
    await flushSync();
    if (ui.sync.state === "ok") render();
  }

  function persistSync() {
    try {
      localStorage.setItem(SYNC_KEY, JSON.stringify({ pending: ui.sync.pending, auto: ui.sync.auto, last: ui.sync.last }));
    } catch (e) {}
  }

  function loadSync() {
    try {
      const d = JSON.parse(localStorage.getItem(SYNC_KEY) || "{}");
      if (d.pending) ui.sync.pending = d.pending;
      if (typeof d.auto === "boolean") ui.sync.auto = d.auto;
      if (d.last) ui.sync.last = d.last;
    } catch (e) {}
  }
